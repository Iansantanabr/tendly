<!doctype html>
<html lang="en" data-app-color="{{COLOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="stylesheet" href="/api/hub/apps/kit.css">
  <script src="/api/hub/apps/sdk.js"></script>
  <script src="/api/hub/apps/kit.js"></script>
  <style>
    .board-page { max-width: none; height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
    t-kanban { min-height: 0; height: 100%; }
    .settings-stack { display: grid; gap: var(--t-space-3); max-width: 720px; }
    .settings-stack > .t-card { display: grid; gap: var(--t-space-3); }
    .settings-stack .t-card-head h2 { margin: 0; font-size: var(--t-text-lg); }
  </style>
</head>
<body>
  <t-app>
    <t-nav label="Sections">
      <span class="t-nav-title"><span class="t-tile" aria-hidden="true">{{LETTER}}</span><span>{{NAME}}</span></span>
      <button data-view="board" data-icon="board">Board</button>
      <button data-view="list" data-icon="table">List</button>
      <button data-view="settings" data-icon="settings" class="t-nav-end">Settings</button>
    </t-nav>
    <main class="t-app-main">
      <t-view name="board">
        <div class="t-page board-page">
          <header class="t-page-head">
            <div><h1 class="t-title">{{NAME}}</h1><p class="t-muted">{{DESCRIPTION}}</p></div>
            <button type="button" class="t-button primary new-card">New card</button>
          </header>
          <t-sample-banner class="sample-banner"></t-sample-banner>
          <div id="board">
            <div id="status"><t-state kind="loading"></t-state></div>
            <t-empty-start id="empty" hidden title="No cards yet" text="Add your first card, or load a few examples to see how the board works." action="New card"></t-empty-start>
            <t-kanban id="kanban" addable hidden empty-text="Drop a card here"></t-kanban>
          </div>
        </div>
      </t-view>
      <t-view name="list">
        <div class="t-page">
          <header class="t-page-head">
            <h1 class="t-title">All cards</h1>
            <button type="button" class="t-button primary new-card">New card</button>
          </header>
          <t-sample-banner class="sample-banner"></t-sample-banner>
          <t-pills id="stage-filter"></t-pills>
          <t-table id="table" searchable empty-text="No cards yet"></t-table>
        </div>
      </t-view>
      <t-view name="settings">
        <div class="t-page">
          <header class="t-page-head"><h1 class="t-title">Settings</h1></header>
          <div class="settings-stack">
            <section class="t-card">
              <div class="t-card-head"><h2>Columns</h2></div>
              <p class="t-muted">The stages a card goes through. Drag to reorder. Deleting a column asks where to move its cards.</p>
              <t-list-editor id="columns-editor" tones></t-list-editor>
            </section>
            <section class="t-card">
              <div class="t-card-head"><h2>Card fields</h2></div>
              <p class="t-muted">Every card has a title and notes. Turn on what else you want to track.</p>
              <label class="t-switch-line"><input type="checkbox" class="t-switch" data-field="value"><span>Value</span></label>
              <label class="t-switch-line"><input type="checkbox" class="t-switch" data-field="due"><span>Due date</span></label>
              <label class="t-switch-line"><input type="checkbox" class="t-switch" data-field="owner"><span>Owner</span></label>
              <label class="t-field" id="currency-field"><span>Currency</span><select id="currency"></select></label>
            </section>
            <t-data-tools id="tools"></t-data-tools>
          </div>
        </div>
      </t-view>
    </main>
  </t-app>

  <t-detail id="detail" title-field="title">
    <button type="button" slot="actions" class="t-button" id="detail-edit">Edit</button>
    <select slot="actions" class="t-input" id="detail-move" aria-label="Move to"></select>
    <button type="button" slot="actions" class="t-button danger" id="detail-delete">Delete</button>
  </t-detail>

  <t-modal id="editor" title="Card">
    <form id="card-form" class="t-form" novalidate>
      <t-record-form id="record-form"></t-record-form>
      <div class="t-actions">
        <button type="button" class="t-button danger" id="delete" hidden>Delete</button>
        <span class="t-spacer"></span>
        <button type="button" class="t-button" id="cancel">Cancel</button>
        <button type="submit" class="t-button primary" id="save">Save</button>
      </div>
    </form>
  </t-modal>

  <t-modal id="move-modal" title="Move cards">
    <form id="move-form" class="t-form">
      <p id="move-text"></p>
      <label class="t-field"><span>Move them to</span><select id="move-target"></select></label>
      <div class="t-actions">
        <span class="t-spacer"></span>
        <button type="button" class="t-button" id="move-cancel">Cancel</button>
        <button type="submit" class="t-button primary">Move and delete column</button>
      </div>
    </form>
  </t-modal>

  <script>
    // PAGE MAP: text (T) -> defaults -> state -> helpers -> render (board, list) -> card editor and detail ->
    // column/field settings -> data tools -> start-up. CSV, examples, delete-all and the empty state are kit elements.
    // DATA: cards are records in the collection `cards` { title, column, text, order, value?, due?, owner? }.
    // Settings are one tendly.data key `settings`: { v, columns: [{ id, label, tone }], fields: ['value'|'due'|'owner'], currency }.
    // Old apps kept the columns in the key `columns` ([{ id, title }]): start-up copies them into `settings` once.

    // All visible text of the script lives here (the pt-BR twin only changes this block, the markup and lang).
    const T = {
      cardWord: n => n === 1 ? 'card' : 'cards',
      all: 'All', addColumn: 'Add a column',
      todo: 'To do', doing: 'Doing', done: 'Done',
      fTitle: 'Title', fColumn: 'Column', fNotes: 'Notes', fValue: 'Value', fDue: 'Due date', fOwner: 'Owner',
      newCard: 'New card', editCard: 'Edit card', moveTo: 'Move to…',
      loadFail: 'Could not load the board', retry: 'Try again',
      conflict: 'Someone changed this card meanwhile; it was reloaded.', notFound: 'That card no longer exists.',
      deleteQ: title => 'Delete "' + title + '"?', del: 'Delete',
      keepOne: 'Keep at least one column.',
      moveAsk: (names, n) => n + ' ' + T.cardWord(n) + ' in ' + names + '. Where should they go?',
      csvName: 'Cards',
      summary: (n, parts) => 'Board: ' + n + ' ' + T.cardWord(n) + '. ' + parts,
      summaryEmpty: 'Board: no cards yet',
      sel: title => 'Card: ' + title,
      // Examples: [title, stage 0|1|2 (first, middle, last column), value, due in days, owner, notes]
      examples: [
        ['Proposal for an accounting firm', 0, 4800, 5, 'Marina', 'Send the proposal with three plan options.'],
        ['Call back the bakery owner', 0, 1200, 2, 'Rafael', 'Asked for a quote on the monthly plan.'],
        ['Quote for a clinic renovation', 0, 9500, 9, 'Marina', ''],
        ['Alignment meeting with the dental clinic', 1, 6200, 1, 'Paulo', 'Bring the schedule and two references.'],
        ['Contract with the language school', 1, 3400, -1, 'Rafael', 'Waiting for their legal review.'],
        ['Yearly plan renewal', 1, 15000, 12, 'Marina', ''],
        ['Website for the bike shop', 2, 7800, -6, 'Paulo', 'Delivered and approved.'],
        ['Training for the support team', 2, 2500, -3, 'Rafael', '']
      ]
    };

    const DEFAULTS = {
      v: 1,
      columns: [{ id: 'todo', label: T.todo, tone: '' }, { id: 'doing', label: T.doing, tone: 'accent' }, { id: 'done', label: T.done, tone: 'ok' }],
      fields: [],        // which optional card fields are on: 'value', 'due', 'owner'
      currency: 'BRL'
    };
    const OPTIONAL = [
      { id: 'value', label: T.fValue, type: 'money' },
      { id: 'due', label: T.fDue, type: 'date' },
      { id: 'owner', label: T.fOwner, type: 'text' }
    ];
    const CURRENCIES = ['BRL', 'USD', 'EUR', 'GBP'];

    const cards = tendly.db.collection('cards');
    const $ = id => document.getElementById(id);
    const status = $('status'), empty = $('empty'), kanban = $('kanban'), table = $('table'), pills = $('stage-filter');
    const editor = $('editor'), cardForm = $('card-form'), recordForm = $('record-form');
    const detail = $('detail'), columnsEditor = $('columns-editor'), tools = $('tools');
    const moveModal = $('move-modal'), moveForm = $('move-form');
    const fail = error => tkit.toast(error && error.message ? error.message : String(error), { tone: 'error' });
    let S, store, editing = null, loaded = false, moveResolve = null, importOrder = 0;

    // ---- helpers -----------------------------------------------------------------------------
    const columns = () => S.value.columns;
    const hasField = id => S.value.fields.indexOf(id) >= 0;
    const orderOf = r => r.data.order || 0;
    // A card whose column was deleted (or never existed) shows in the first column instead of vanishing.
    function columnOf(record) { return columns().some(c => c.id === record.data.column) ? record.data.column : columns()[0].id; }
    function columnLabel(id) { const c = columns().find(x => x.id === id); return c ? c.label : id; }
    const byOrder = list => list.slice().sort((a, b) => orderOf(a) - orderOf(b) || a.created_at.localeCompare(b.created_at));
    function endOrder(columnId) {
      const mine = store.records.filter(r => columnOf(r) === columnId).map(orderOf);
      return mine.length ? Math.max.apply(null, mine) + 1 : 1;
    }
    // The schema of a card, from the settings (same format the kit's form, detail, importer and CSV read).
    function fieldsNow() {
      return [{ id: 'title', label: T.fTitle, type: 'text', required: true }, { id: 'column', label: T.fColumn, type: 'choice', required: true, options: columns() }]
        .concat(OPTIONAL.filter(f => hasField(f.id)), [{ id: 'text', label: T.fNotes, type: 'longtext' }]);
    }
    function isOverdue(record) {
      return !!record.data.due && record.data.due < tkit.today() && columnOf(record) !== columns()[columns().length - 1].id;
    }
    function cardMeta(r) {
      const parts = [];
      if (hasField('value') && r.data.value !== undefined && r.data.value !== null) parts.push(tkit.money(r.data.value, S.value.currency));
      if (hasField('due') && r.data.due) parts.push(tkit.date(r.data.due));
      if (!parts.length) return { meta: tkit.ago(r.updated_at) };
      return { meta: parts.join(' · '), tone: hasField('due') && isOverdue(r) ? 'danger' : '' };
    }

    // ---- render: board and list --------------------------------------------------------------
    kanban.columnMeta = (id, list) => hasField('value') ? tkit.money(list.reduce((sum, c) => sum + (Number(c.value) || 0), 0), S.value.currency) : '';
    kanban.addEventListener('t-move', async event => {
      const { id, to, index } = event.detail;
      const others = store.records.filter(r => columnOf(r) === to && r.id !== id).sort((a, b) => orderOf(a) - orderOf(b));
      const before = others[index - 1], after = others[index];
      const order = before && after ? (orderOf(before) + orderOf(after)) / 2 : after ? orderOf(after) - 1 : before ? orderOf(before) + 1 : 1;
      try { await cards.update(id, { column: to, order }); } catch (error) { fail(error); store.reload(); }
    });
    kanban.addEventListener('t-open', event => showDetail(store.records.find(r => r.id === event.detail.id)));
    kanban.addEventListener('t-add', event => openEditor(null, event.detail.column));
    empty.addEventListener('t-action', () => openEditor(null));
    empty.addEventListener('t-examples', () => seedFields().then(() => tkit.samples.load(cards, exampleDocs())).catch(fail));
    function drawList(sorted) {
      const tones = {};
      columns().forEach(c => { tones[c.label] = c.tone; });
      const cols = [{ key: 'title', label: T.fTitle }, { key: 'column', label: T.fColumn, type: 'badge', tones }];
      if (hasField('value')) cols.push({ key: 'value', label: T.fValue, type: 'money', currency: S.value.currency });
      if (hasField('due')) cols.push({ key: 'due', label: T.fDue, type: 'date' });
      if (hasField('owner')) cols.push({ key: 'owner', label: T.fOwner });
      cols.push({ key: 'text', label: T.fNotes });
      table.columns = cols;
      table.rows = sorted.map(r => ({ id: r.id, title: r.data.title, column: columnLabel(columnOf(r)), columnId: columnOf(r), value: r.data.value, due: r.data.due || '', owner: r.data.owner || '', text: r.data.text || '', updated_at: r.updated_at }));
      pills.options = [{ value: '', label: T.all, count: sorted.length }].concat(columns().map(c => ({ value: c.id, label: c.label, count: sorted.filter(r => columnOf(r) === c.id).length })));
    }
    function setSummary() {
      if (!loaded) return;
      const n = store.records.length;
      const parts = columns().map(c => c.label + ' ' + store.records.filter(r => columnOf(r) === c.id).length).join(', ');
      tkit.context({ summary: n ? T.summary(n, parts) : T.summaryEmpty });
    }
    function render() {
      loaded = true;
      const sorted = byOrder(store.records);
      tkit.clear(status);
      empty.hidden = sorted.length > 0;
      kanban.hidden = !sorted.length;
      kanban.columns = columns().map(c => ({ id: c.id, title: c.label }));
      kanban.cards = sorted.map(r => Object.assign({ id: r.id, column: columnOf(r), title: r.data.title, text: r.data.text, value: r.data.value }, cardMeta(r)));
      drawList(sorted);
      document.querySelectorAll('.sample-banner').forEach(b => { b.count = tkit.samples.count(store.records); });
      tools.fields = fieldsNow();
      tools.records = store.records;
      if (detail.opened) {
        const fresh = detail.record && store.records.find(r => r.id === detail.record.id);
        if (fresh) { detail.record = fresh; detail.siblings = sorted.map(r => r.id); } else detail.close();
      }
      setSummary();
      syncRoute();
    }

    // ---- card editor and detail --------------------------------------------------------------
    function openEditor(record, column) {
      editing = record || null;
      recordForm.fields = fieldsNow();
      recordForm.settings = { currency: S.value.currency };
      recordForm.value = record ? Object.assign({}, record.data, { column: columnOf(record) }) : { column: column || columns()[0].id };
      $('delete').hidden = !record;
      editor.title = record ? T.editCard : T.newCard;
      editor.open();
      recordForm.focus();
    }
    cardForm.addEventListener('submit', async event => {
      event.preventDefault();
      let data;
      try { data = await recordForm.submit(); } catch (error) { if (error.code !== 'invalid') fail(error); return; }
      $('save').disabled = true;
      try {
        if (editing) {
          if (data.column !== columnOf(editing)) data.order = endOrder(data.column);
          await cards.update(editing.id, data, { rev: editing.rev });
        } else {
          data.order = endOrder(data.column);
          await cards.insert(data);
        }
        editor.close();
      } catch (error) {
        if (error.code === 'conflict') { tkit.toast(T.conflict, { tone: 'error' }); editing = error.current; recordForm.value = Object.assign({}, editing.data, { column: columnOf(editing) }); }
        else fail(error);
      } finally { $('save').disabled = false; }
    });
    $('cancel').addEventListener('click', () => editor.close());
    recordForm.addEventListener('t-input', () => { tendly.host.holdReload(true); });
    editor.addEventListener('t-close', () => { tendly.host.holdReload(false); });
    async function deleteCard(record) {
      if (!record || !await tkit.confirm(T.deleteQ(record.data.title), { confirm: T.del, tone: 'danger' })) return false;
      try { await cards.remove(record.id); return true; } catch (error) { fail(error); return false; }
    }
    $('delete').addEventListener('click', async () => { if (await deleteCard(editing)) editor.close(); });
    document.querySelectorAll('.new-card').forEach(b => b.addEventListener('click', () => openEditor(null)));
    table.addEventListener('t-open', event => showDetail(store.records.find(r => r.id === event.detail.id)));
    pills.value = '';
    pills.addEventListener('t-change', event => { const stage = event.detail.value; table.filter = stage ? row => row.columnId === stage : null; });

    function showDetail(record) {
      if (!record) return;
      detail.fields = fieldsNow();
      detail.settings = { currency: S.value.currency };
      detail.siblings = byOrder(store.records).map(r => r.id);
      detail.record = record;
      const select = $('detail-move');
      tkit.clear(select);
      select.appendChild(tkit.h('option', { value: '', text: T.moveTo }));
      columns().forEach(c => { if (c.id !== columnOf(record)) select.appendChild(tkit.h('option', { value: c.id, text: c.label })); });
      select.value = '';
      detail.open();
      tkit.context({ selection: T.sel(record.data.title) });
    }
    detail.addEventListener('t-nav', event => showDetail(store.records.find(r => r.id === event.detail.id)));
    $('detail-edit').addEventListener('click', () => openEditor(detail.record));
    $('detail-delete').addEventListener('click', async () => { const record = detail.record; if (await deleteCard(record)) detail.close(); });
    $('detail-move').addEventListener('change', async event => {
      const to = event.target.value, record = detail.record;
      if (!to || !record) return;
      try { await cards.update(record.id, { column: to, order: endOrder(to) }); } catch (error) { fail(error); }
    });
    // A link like #board/<id> (or #list/<id>) opens that card; closing the drawer clears the id.
    function syncRoute(route) {
      route = route || tkit.route.get();
      if (!loaded) return;
      if (route.id && (route.view === 'board' || route.view === 'list')) {
        const record = store.records.find(r => r.id === route.id);
        if (!record) { tkit.toast(T.notFound); tkit.route.close(); }
        else if (!(detail.opened && detail.record && detail.record.id === record.id)) showDetail(record);
      } else if (detail.opened) detail.close();
    }

    // ---- settings: columns and card fields ---------------------------------------------------
    function askMove(gone, remaining, n) {
      return new Promise(resolve => {
        moveResolve = resolve;
        $('move-text').textContent = T.moveAsk(gone.map(c => c.label).join(', '), n);
        const select = $('move-target');
        tkit.clear(select);
        remaining.forEach(c => select.appendChild(tkit.h('option', { value: c.id, text: c.label })));
        moveModal.open();
      });
    }
    moveForm.addEventListener('submit', event => {
      event.preventDefault();
      const resolve = moveResolve, target = $('move-target').value;
      moveResolve = null;
      moveModal.close();
      if (resolve) resolve(target);
    });
    $('move-cancel').addEventListener('click', () => moveModal.close());
    moveModal.addEventListener('t-close', () => { const resolve = moveResolve; moveResolve = null; if (resolve) resolve(null); });

    columnsEditor.addLabel = T.addColumn;
    columnsEditor.addEventListener('t-change', async event => {
      const items = event.detail.items, before = columns();
      if (!items.length) { tkit.toast(T.keepOne, { tone: 'error' }); columnsEditor.items = before; return; }
      const gone = before.filter(c => !items.some(i => i.id === c.id));
      const stranded = gone.length ? store.records.filter(r => gone.some(g => g.id === r.data.column)) : [];
      try {
        if (stranded.length) {
          const target = await askMove(gone, items, stranded.length);
          if (!target) { columnsEditor.items = before; return; }
          let order = endOrder(target);
          for (const r of stranded) await cards.update(r.id, { column: target, order: order++ });
        }
        await S.save({ columns: items });
      } catch (error) { fail(error); columnsEditor.items = columns(); }
    });
    document.querySelectorAll('[data-field]').forEach(box => box.addEventListener('change', () => {
      const on = Array.prototype.filter.call(document.querySelectorAll('[data-field]'), b => b.checked).map(b => b.dataset.field);
      S.save({ fields: on }).catch(fail);
    }));
    $('currency').addEventListener('change', event => { S.save({ currency: event.target.value }).catch(fail); });
    function applySettings() {
      const v = S.value;
      document.querySelectorAll('[data-field]').forEach(b => { b.checked = v.fields.indexOf(b.dataset.field) >= 0; });
      $('currency-field').hidden = v.fields.indexOf('value') < 0;
      const select = $('currency');
      tkit.clear(select);
      (CURRENCIES.indexOf(v.currency) >= 0 ? CURRENCIES : CURRENCIES.concat(v.currency)).forEach(code => select.appendChild(tkit.h('option', { value: code, text: code })));
      select.value = v.currency;
      columnsEditor.items = v.columns;
      if (store && loaded) render();
    }

    // ---- data tools: CSV, examples, delete all (the kit draws the three cards) ----------------
    // Examples show value and due date, so those fields are switched on first if neither is.
    const seedFields = async () => { if (!hasField('value') && !hasField('due')) await S.save({ fields: hasField('owner') ? ['value', 'due', 'owner'] : ['value', 'due'] }); };
    function exampleDocs() {
      const cols = columns(), stage = [cols[0].id, cols[Math.min(1, cols.length - 1)].id, cols[cols.length - 1].id], seen = {};
      return T.examples.map(e => {
        seen[e[1]] = (seen[e[1]] || 0) + 1;
        return { title: e[0], column: stage[e[1]], value: e[2], due: tkit.daysFromToday(e[3]), owner: e[4], text: e[5], order: seen[e[1]] };
      });
    }
    tools.collection = cards;
    tools.noun = { one: T.cardWord(1), many: T.cardWord(2) };
    tools.filename = T.csvName;
    tools.examples = exampleDocs;
    tools.beforeExamples = seedFields;
    tools.exportRows = records => byOrder(records).map(r => Object.assign({}, r.data, { column: columnOf(r) }));
    tools.beforeInsert = doc => { importOrder = Math.max(importOrder, ...store.records.map(orderOf)) + 1; return Object.assign({ column: columns()[0].id }, doc, { order: importOrder }); };
    document.querySelectorAll('.sample-banner').forEach(b => b.addEventListener('t-clear', () => tkit.samples.clear(cards).catch(fail)));

    // ---- start-up ----------------------------------------------------------------------------
    async function migrateOldColumns() {
      if (S.error) return;   // the read failed: never write over settings we could not read
      let saved = null, old = null;
      try { saved = await tendly.data.get('settings', null); } catch (_) { return; }
      if (saved && Array.isArray(saved.columns) && saved.columns.length) return;
      try { old = await tendly.data.get('columns', null); } catch (_) { return; }
      if (!Array.isArray(old)) return;
      const migrated = old.filter(c => c && c.id).map(c => ({ id: String(c.id), label: String(c.label || c.title || c.id), tone: '' }));
      if (migrated.length) await S.save({ columns: migrated }).catch(fail);
    }
    document.querySelector('t-app').addEventListener('t-view', () => setTimeout(setSummary, 0));
    tkit.route.on(syncRoute);
    (async () => {
      S = await tkit.settings('settings', DEFAULTS);
      if (S.error) fail(S.error);
      await migrateOldColumns();
      S.on(applySettings);
      applySettings();
      store = tkit.live(cards, render, { limit: 5000, onError: error => {
        tkit.clear(status);
        empty.hidden = true; kanban.hidden = true;
        status.appendChild(tkit.h('t-state', { kind: 'error', title: T.loadFail, text: error.message },
          tkit.h('button', { type: 'button', class: 't-button', text: T.retry, onClick: () => store.reload() })));
      } });
    })();
  </script>
</body>
</html>
