<!doctype html>
<html lang="en" data-app-color="{{COLOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="stylesheet" href="/api/hub/apps/kit.css">
  <script src="/api/hub/apps/sdk.js"></script>
  <script src="/api/hub/apps/kit.js"></script>
  <style>
    .group-title { margin: var(--t-space-3) 0 var(--t-space-2); font-size: var(--t-text-md); font-weight: 600; color: var(--t-ink-soft); }
    .group-title.late { color: var(--t-danger-ink); }
    .row-progress { width: 130px; flex: none; }
    .t-row .t-switch { margin-right: var(--t-space-1); }
    details.done-group > summary { cursor: pointer; margin-bottom: var(--t-space-2); }
    .settings-stack { display: grid; gap: var(--t-space-3); max-width: 720px; }
    .settings-stack .t-card { display: grid; gap: var(--t-space-3); }
    .run-bar { position: sticky; bottom: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: var(--t-space-2); padding: var(--t-space-3); border-top: 1px solid var(--t-line); background: var(--t-surface); }
    .run-hint { flex-basis: 100%; margin: 0; }
    .days { display: flex; flex-wrap: wrap; gap: var(--t-space-1); }
    .days .t-button[aria-pressed="true"] { background: var(--t-accent-soft); color: var(--t-accent-ink); border-color: var(--t-accent); }
    .t-actions.start { justify-content: flex-start; }
    .row-link { display: grid; gap: 1px; flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .row-link small { color: var(--t-muted); font-size: var(--t-text-sm); }
    .flip { display: inline-flex; transform: rotate(180deg); }
    .step-row { display: flex; flex-wrap: wrap; gap: var(--t-space-2); align-items: center; }
    .step-row > input[type=text] { flex: 1 1 180px; min-width: 0; }
    .step-row .step-tools { display: flex; align-items: center; gap: 2px; }
    #steps-list { display: grid; gap: var(--t-space-2); }
  </style>
</head>
<body>
  <t-app>
    <t-nav label="Sections">
      <span class="t-nav-title"><span class="t-tile" aria-hidden="true">{{LETTER}}</span><span>{{NAME}}</span></span>
      <button data-view="today" data-icon="check-square">Today</button>
      <button data-view="routines" data-icon="repeat">Routines</button>
      <button data-view="history" data-icon="clock">History</button>
      <button data-view="settings" data-icon="settings" class="t-nav-end">Settings</button>
    </t-nav>
    <main class="t-app-main">
      <t-view name="today">
        <div class="t-page">
          <header class="t-page-head">
            <div><h1 class="t-title">{{NAME}}</h1><p class="t-muted">{{DESCRIPTION}}</p></div>
            <button type="button" class="t-button primary new-routine">New routine</button>
          </header>
          <t-sample-banner id="banner"></t-sample-banner>
          <p class="t-muted" id="notify-off" hidden>Bell alerts are off for this app.</p>
          <t-empty-start id="empty" title="No routines yet" text="Create your first checklist, or look around with examples first." action="New routine" hidden></t-empty-start>
          <div id="today-body"><t-state kind="loading"></t-state></div>
        </div>
      </t-view>
      <t-view name="run">
        <div class="t-page">
          <header class="t-page-head">
            <button type="button" class="t-button" id="run-back">Back</button>
            <div><h1 class="t-title" id="run-title"></h1><p class="t-muted" id="run-sub"></p></div>
          </header>
          <t-checklist id="run-check"></t-checklist>
          <div class="t-actions start"><button type="button" class="t-button" id="run-note-btn">Add a note to a step</button></div>
          <label class="t-field"><span>Note for this run</span><textarea id="run-note" rows="2"></textarea></label>
          <div class="run-bar" id="run-bar">
            <button type="button" class="t-button danger" id="run-discard">Discard</button>
            <span class="t-spacer"></span>
            <button type="button" class="t-button" id="run-skip">Skip this time</button>
            <button type="button" class="t-button primary" id="run-finish">Finish</button>
            <p class="t-muted run-hint" id="run-hint"></p>
          </div>
        </div>
      </t-view>
      <t-view name="routines">
        <div class="t-page">
          <header class="t-page-head">
            <h1 class="t-title">Routines</h1>
            <button type="button" class="t-button primary new-routine">New routine</button>
          </header>
          <t-sample-banner class="banner-copy"></t-sample-banner>
          <div id="routine-list"></div>
        </div>
      </t-view>
      <t-view name="history">
        <div class="t-page">
          <header class="t-page-head"><h1 class="t-title">History</h1></header>
          <t-pills id="hist-pills"></t-pills>
          <t-table id="hist-table" searchable empty-text="No runs yet"></t-table>
        </div>
      </t-view>
      <t-view name="settings">
        <div class="t-page">
          <header class="t-page-head"><h1 class="t-title">Settings</h1></header>
          <div class="settings-stack">
            <section class="t-card">
              <div class="t-card-head"><h2>You and alerts</h2></div>
              <label class="t-field"><span>Your name</span><input id="person" type="text" autocomplete="name"></label>
              <p class="t-muted">Used as the person who did each run.</p>
              <div class="t-field"><span>Week starts on</span>
                <div class="t-segment" role="group" aria-label="Week starts on" id="week-start"><button type="button" data-ws="0" aria-pressed="false">Sunday</button><button type="button" data-ws="1" aria-pressed="false">Monday</button></div>
              </div>
              <label class="t-switch-line"><input type="checkbox" class="t-switch" id="notify-late"><span>Alert me on the bell when a routine is late</span></label>
            </section>
            <t-data-tools id="tools" hide="import"></t-data-tools>
          </div>
        </div>
      </t-view>
    </main>
  </t-app>

  <t-modal id="routine-modal" title="Routine">
    <form id="routine-form" class="t-form" novalidate>
      <label class="t-field"><span>Name</span><input id="r-name" type="text" required></label>
      <label class="t-field"><span>Description</span><textarea id="r-description" rows="2"></textarea></label>
      <label class="t-field"><span>Owner</span><input id="r-owner" type="text"></label>
      <div class="t-field"><span>Frequency</span>
        <div class="t-segment" role="group" aria-label="Frequency" id="r-kind">
          <button type="button" data-kind="daily">Daily</button><button type="button" data-kind="weekly">Weekly</button><button type="button" data-kind="monthly">Monthly</button><button type="button" data-kind="once">Once</button><button type="button" data-kind="manual">On demand</button>
        </div>
      </div>
      <div class="t-field" id="r-weekly"><span>Days of the week</span><div class="days" id="r-days"></div><small class="t-muted">One run on each day you mark.</small></div>
      <label class="t-field" id="r-monthly"><span>Day of the month</span><input id="r-day" type="number" min="1" max="31"></label>
      <label class="t-field" id="r-once"><span>Date</span><input id="r-date" type="date"></label>
      <label class="t-field" id="r-time-field"><span>Due time (optional)</span><input id="r-time" type="time"></label>
      <div class="t-field"><span>Steps</span><div id="steps-list"></div>
        <div class="t-actions start"><button type="button" class="t-button small" id="add-step">Add step</button></div>
      </div>
      <div class="t-actions">
        <button type="button" class="t-button danger" id="r-delete" hidden>Delete</button>
        <span class="t-spacer"></span>
        <button type="button" class="t-button" id="r-cancel">Cancel</button>
        <button type="submit" class="t-button primary" id="r-save">Save</button>
      </div>
    </form>
  </t-modal>

  <t-modal id="skip-modal" title="Skip this time">
    <form id="skip-form" class="t-form">
      <label class="t-field"><span>Why are you skipping it?</span><textarea id="skip-reason" rows="3"></textarea></label>
      <div class="t-actions"><span class="t-spacer"></span><button type="button" class="t-button" id="skip-cancel">Cancel</button><button type="submit" class="t-button primary">Skip</button></div>
    </form>
  </t-modal>

  <t-modal id="note-modal" title="Note on a step">
    <form id="note-form" class="t-form">
      <label class="t-field"><span>Step</span><select id="note-step"></select></label>
      <label class="t-field"><span>Note</span><textarea id="note-text" rows="3"></textarea></label>
      <div class="t-actions"><span class="t-spacer"></span><button type="button" class="t-button" id="note-cancel">Cancel</button><button type="submit" class="t-button primary">Save</button></div>
    </form>
  </t-modal>

  <script>
    // PAGE MAP: strings (T) -> LOGIC (pure due/late rules, tested in checklist-logic.test.mjs) -> state -> Today -> run screen ->
    // routines list and editor -> history -> settings -> late notifications -> examples -> start-up.
    // DATA: routines `routines` { name, description, steps: [{ id, label, required }], frequency: { kind, weekdays?, day?, date? }, dueTime, owner, active, order };
    // runs `runs` { routineId, routineName, period, startedAt, finishedAt, by, items: [{ stepId, label, required, done, at, note }], status, note }.
    // Settings: tendly.data key `settings` { v, person, weekStart, notifyLate, lastNotified }.
    // WEEKLY: one run per chosen weekday (period = that day). It is due on the day, late after its dueTime, and stays late until the next chosen weekday takes over.

    // All visible text of the script lives here (the pt-BR twin of this file only changes this block, the markup and lang).
    const T = {
      sDone: 'Done', sSkipped: 'Skipped', sOpen: 'In progress',
      at: time => 'at ' + time, everyDay: 'Every day', everyWeekdays: names => 'Every ' + (names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]),
      monthly: day => 'Every month, day ' + day, onceOn: date => 'Once, on ' + date, manual: 'On demand',
      dayShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], dayLong: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      todayComma: date => 'Today, ' + date, todayWord: 'today',
      stepsN: n => n + (n === 1 ? ' step' : ' steps'), late: 'Late', view: 'View', continue: 'Continue', start: 'Start',
      secLate: 'Late', secOpen: 'In progress', secToday: 'For today', secDone: 'Done today',
      nothingTitle: 'Nothing for today', nothingText: 'Every routine is up to date. Start one on demand from Routines.',
      summary: (late, today, open) => 'Today: ' + late + ' late, ' + today + ' for today, ' + open + ' in progress',
      finishedInfo: (status, by, when) => status + (by ? ' by ' + by : '') + (when ? ', ' + when : ''),
      missing: list => 'Required steps left: ' + list,
      runSel: (name, when, done, total) => 'Run: ' + name + ' (' + when + ', ' + done + ' of ' + total + ')',
      notFound: 'That run no longer exists.', finishedToast: 'Run finished', discardQ: 'Discard this run? The ticks are lost.', discard: 'Discard',
      paused: 'Paused', next: when => 'next: ' + when, active: 'Active', stepPlaceholder: 'What to do', stepN: n => 'Step ' + n, required: 'Required',
      delete: 'Delete', moveUp: 'Move up', moveDown: 'Move down', editRoutine: 'Edit routine', newRoutineTitle: 'New routine',
      needName: 'Give the routine a name.', needStep: 'Add at least one step.', needDate: 'Choose a date.',
      conflict: 'Someone changed this meanwhile; it was reloaded.', deleteQ: name => 'Delete "' + name + '"? Its past runs stay in History.',
      emptyTitle: 'No routines yet', emptyText: 'Create a routine, or look around with examples first.',
      loadFail: 'Could not load the routines', retry: 'Try again', all: 'All',
      cRoutine: 'Routine', cPeriod: 'Period', cStatus: 'Status', cBy: 'By', cStarted: 'Started', cFinished: 'Finished', cItems: 'Steps', cDone: 'Steps done', cTotal: 'Steps', cNote: 'Note',
      noun: { one: 'run', many: 'runs' }, csvName: 'Runs',
      notifyTitle: 'Late routines', notifyBody: (n, names) => n + (n === 1 ? ' routine is late: ' : ' routines are late: ') + names.join(', ') + (n > names.length ? '...' : ''),
      examples: {
        people: ['Marina', 'Rafael', 'Paulo'], skipReason: 'The store was closed for a holiday.',
        routines: [
          { name: 'Opening the store', description: 'Everything to check before the doors open.', owner: 'Marina', frequency: { kind: 'daily' }, dueTime: '08:30', required: [1, 5],
            steps: ['Turn on the lights and signs', 'Count the cash drawer', 'Check the fridge temperature', 'Clean the entrance and windows', 'Restock the shelves', 'Test the card machine'] },
          { name: 'Weekly fire extinguisher check', description: 'A quick walk around every extinguisher.', owner: 'Paulo', frequency: { kind: 'weekly', weekdays: [1] }, dueTime: '10:00', required: [0, 1],
            steps: ['Gauge is in the green', 'Safety pin and seal are in place', 'No dents or rust', 'Service date is still valid'] },
          { name: 'Month-end close', description: 'What to finish before the new month starts.', owner: 'Rafael', frequency: { kind: 'monthly', day: 1 }, dueTime: '17:00', required: [0, 4],
            steps: ['Reconcile the bank accounts', 'Issue the pending invoices', 'Record the month expenses', 'Review the unpaid accounts', 'Send the report to the owner'] }
        ]
      }
    };

    // LOGIC START
    // Pure rules: no DOM, no SDK. Dates are 'YYYY-MM-DD' strings; "now" is a Date or { date, time: 'HH:MM' }.
    // A routine here is a plain object { id, frequency, dueTime, active, ... }; a run is { routineId, period, status, startedAt, finishedAt, items }.
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function ymdParts(ymd) { const p = String(ymd).split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
    function ymdFormat(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
    function ymdAdd(ymd, days) {
      const p = ymdParts(ymd), t = new Date(Date.UTC(p.y, p.m - 1, p.d + days));
      return ymdFormat(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
    }
    function ymdWeekday(ymd) { const p = ymdParts(ymd); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }   // 0 = Sunday
    function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
    function clockOf(now) {
      if (now && now.date) return { date: now.date, time: now.time || '00:00' };
      const d = now || new Date();
      return { date: ymdFormat(d.getFullYear(), d.getMonth() + 1, d.getDate()), time: pad2(d.getHours()) + ':' + pad2(d.getMinutes()) };
    }
    // The first day of the week that holds `ymd`. weekStart: 0 = Sunday, 1 = Monday.
    function weekStartOf(ymd, weekStart) { return ymdAdd(ymd, -((ymdWeekday(ymd) - (weekStart || 0) + 7) % 7)); }
    // The period around `date`: { period, opens, deadline }, or null when the routine has no schedule (manual, or "once" without a date).
    // daily: that day. weekly: the latest chosen weekday up to `date` (period = that day; opens and ends on it, so a missed one stays late
    // until the next chosen weekday). weekStart is unused here. Runs saved with the old week-start period just count for that date.
    // monthly: the month (period = the 1st), opens and ends on `day` (31 becomes the last day of a short month). once: its date.
    function windowFor(routine, date, weekStart) {
      const f = routine.frequency || {};
      if (f.kind === 'daily') return { period: date, opens: date, deadline: date };
      if (f.kind === 'weekly') {
        const days = f.weekdays && f.weekdays.length ? f.weekdays : [1];
        for (let i = 0; i < 7; i++) { const on = ymdAdd(date, -i); if (days.indexOf(ymdWeekday(on)) >= 0) return { period: on, opens: on, deadline: on }; }
        return null;
      }
      if (f.kind === 'monthly') {
        const p = ymdParts(date), day = Math.min(Math.max(f.day || 1, 1), daysInMonth(p.y, p.m)), on = ymdFormat(p.y, p.m, day);
        return { period: ymdFormat(p.y, p.m, 1), opens: on, deadline: on };
      }
      if (f.kind === 'once' && f.date) return { period: f.date, opens: f.date, deadline: f.date };
      return null;
    }
    // The day a run counts for. A manual routine has no schedule: its runs count for the day they start.
    // Weekly: `date` itself when it is a chosen weekday, otherwise null (no run is expected that day).
    function periodFor(routine, date, weekStart) {
      const f = routine.frequency || {};
      if (f.kind === 'weekly') { const w = windowFor(routine, date, weekStart); return w && w.period === date ? date : null; }
      const w = windowFor(routine, date, weekStart);
      return w ? w.period : (f.kind === 'manual' ? date : null);
    }
    // The period a run started on `date` belongs to: the open occurrence (a late weekly one included), else the day itself.
    function runPeriodFor(routine, date, weekStart) {
      const w = windowFor(routine, date, weekStart);
      return w ? w.period : (periodFor(routine, date, weekStart) || date);
    }
    const isFinished = run => run.status === 'done' || run.status === 'skipped';
    function periodDone(routine, runs, period) { return (runs || []).some(r => r.routineId === routine.id && r.period === period && isFinished(r)); }
    function openRunOf(routine, runs) {
      const mine = (runs || []).filter(r => r.routineId === routine.id && r.status === 'open');
      return mine.sort((a, b) => String(b.startedAt).localeCompare(String(a.startedAt)))[0] || null;
    }
    // Due: active, the period has opened, and no done or skipped run exists for it.
    function isDue(routine, runs, now, weekStart) {
      if (routine.active === false) return false;
      const c = clockOf(now), w = windowFor(routine, c.date, weekStart);
      return !!w && c.date >= w.opens && !periodDone(routine, runs, w.period);
    }
    // Late: due and (past the deadline day, or on it with dueTime passed), or an open run left over from an earlier period.
    function isLate(routine, runs, now, weekStart) {
      if (routine.active === false) return false;
      const c = clockOf(now), w = windowFor(routine, c.date, weekStart);
      if (!w) return false;
      if ((runs || []).some(r => r.routineId === routine.id && r.status === 'open' && r.period < w.period)) return true;
      if (!isDue(routine, runs, now, weekStart)) return false;
      return c.date > w.deadline || (c.date === w.deadline && !!routine.dueTime && c.time > routine.dueTime);
    }
    // The next day the routine needs doing (today if it is open now), or null (manual, once and done, paused). `runs` is optional.
    function nextDue(routine, now, runs, weekStart) {
      const f = routine.frequency || {};
      if (routine.active === false || !f.kind || f.kind === 'manual') return null;
      const c = clockOf(now), w = windowFor(routine, c.date, weekStart);
      if (!w) return null;
      if (!periodDone(routine, runs, w.period)) return c.date > w.opens ? c.date : w.opens;
      if (f.kind === 'once') return null;
      const p = ymdParts(w.period);
      if (f.kind === 'weekly') {   // the next chosen weekday after this occurrence
        const days = f.weekdays && f.weekdays.length ? f.weekdays : [1];
        for (let i = 1; i <= 7; i++) { const on = ymdAdd(w.period, i); if (days.indexOf(ymdWeekday(on)) >= 0) return on; }
      }
      const next = f.kind === 'daily' ? ymdAdd(w.period, 1) : ymdAdd(w.period, daysInMonth(p.y, p.m));
      return windowFor(routine, next, weekStart).opens;
    }
    // Today's screen: late / open (in progress) / today (due, not started) / done (finished today). Each entry { routine, run }.
    function groupToday(routines, runs, now, weekStart) {
      const c = clockOf(now), out = { late: [], open: [], today: [], done: [] };
      const key = e => (e.routine.dueTime || '99:99') + ' ' + String(e.routine.name || '');
      routines.forEach(routine => {
        const run = openRunOf(routine, runs);
        if (isLate(routine, runs, now, weekStart)) out.late.push({ routine, run });
        else if (run) out.open.push({ routine, run });
        else if (isDue(routine, runs, now, weekStart)) out.today.push({ routine, run: null });
        else {
          const fin = (runs || []).filter(r => r.routineId === routine.id && isFinished(r) && r.finishedAt && clockOf(new Date(r.finishedAt)).date === c.date)
            .sort((a, b) => String(b.finishedAt).localeCompare(String(a.finishedAt)))[0];
          if (fin) out.done.push({ routine, run: fin });
        }
      });
      ['late', 'open', 'today', 'done'].forEach(k => out[k].sort((a, b) => key(a).localeCompare(key(b))));
      return out;
    }
    const missingRequired = run => (run.items || []).filter(i => i.required && !i.done);
    const runProgress = run => ({ done: (run.items || []).filter(i => i.done).length, total: (run.items || []).length });
    // At most one notification a day, only when asked for and something is late.
    const shouldNotify = (settings, lateEntries, today) => !!settings.notifyLate && lateEntries.length > 0 && settings.lastNotified !== today;
    // LOGIC END

    // ---- state and small helpers ---------------------------------------------------------------
    const DEFAULTS = { v: 1, person: '', weekStart: 0, notifyLate: true, lastNotified: null };
    const routinesCol = tendly.db.collection('routines'), runsCol = tendly.db.collection('runs');
    const $ = id => document.getElementById(id);
    const h = tkit.h, app = document.querySelector('t-app');
    const fail = error => tkit.toast(error && error.message ? error.message : String(error), { tone: 'error' });
    let S, routineStore, runStore, runId = null, lastView = 'today', editing = null, draft = null, notifyDenied = false, notifying = false, doneOpen = false, starting = false;
    const ready = { routines: false, runs: false };
    const isReady = () => ready.routines && ready.runs;
    const plain = rec => Object.assign({}, rec.data, { id: rec.id });
    const routineList = () => routineStore.records.map(plain).sort((a, b) => (a.order || 0) - (b.order || 0));
    const runList = () => runStore.records.map(plain);
    const runRec = id => runStore.records.find(r => r.id === id);
    const ws = () => S.value.weekStart;
    const clock = () => clockOf(new Date());
    const nowIso = () => new Date().toISOString();
    const statusLabel = s => s === 'done' ? T.sDone : s === 'skipped' ? T.sSkipped : T.sOpen;
    function hold(modal) {
      modal.addEventListener('input', () => tendly.host.holdReload(true));
      modal.addEventListener('t-close', () => tendly.host.holdReload(false));
    }
    function freqText(r) {
      const f = r.frequency || {}, at = r.dueTime && f.kind !== 'manual' ? ' ' + T.at(r.dueTime) : '';
      if (f.kind === 'daily') return T.everyDay + at;
      if (f.kind === 'weekly') {
        const days = (f.weekdays && f.weekdays.length ? f.weekdays : [1]).slice().sort((a, b) => (a - ws() + 7) % 7 - (b - ws() + 7) % 7);
        return T.everyWeekdays(days.map(d => T.dayLong[d])) + at;
      }
      if (f.kind === 'monthly') return T.monthly(f.day || 1) + at;
      if (f.kind === 'once') return T.onceOn(tkit.date(f.date)) + at;
      return T.manual;
    }
    function periodText(routine, period) {
      const kind = routine && routine.frequency ? routine.frequency.kind : 'daily', p = ymdParts(period);
      if (kind === 'monthly') return new Intl.DateTimeFormat(document.documentElement.lang, { month: 'long', year: 'numeric' }).format(new Date(p.y, p.m - 1, 1));
      return period === clock().date ? T.todayComma(tkit.date(period)) : tkit.date(period);
    }
    function openRun(id) { location.hash = '#run/' + encodeURIComponent(id); }
    async function startRun(r) {
      if (starting) return;
      starting = true;
      try {
        const c = clock();
        const rec = await runsCol.insert({ routineId: r.id, routineName: r.name, period: runPeriodFor(r, c.date, ws()), startedAt: nowIso(), finishedAt: null, by: S.value.person,
          items: (r.steps || []).map(s => ({ stepId: s.id, label: s.label, required: !!s.required, help: s.help || '', done: false, at: null, note: '' })), status: 'open', note: '' });
        openRun(rec.id);
      } catch (error) { fail(error); } finally { starting = false; }
    }

    // ---- Today -----------------------------------------------------------------------------------
    function rowFor(entry, kind) {
      const r = entry.routine, run = entry.run, meta = [T.stepsN((r.steps || []).length)];
      if (r.dueTime) meta.push(T.at(r.dueTime));
      if (r.owner) meta.push(r.owner);
      const kids = [h('span', { class: 't-row-text' }, h('strong', { text: r.name }), h('small', { text: meta.join(' · ') }))];
      if (kind === 'late') kids.push(h('span', { class: 't-badge danger', text: T.late }));
      if (run && run.status === 'open') { const p = runProgress(run); kids.push(h('t-progress', { class: 'row-progress', value: String(p.done), max: String(p.total) })); }
      kids.push(h('button', { type: 'button', class: 't-button' + (kind === 'done' ? '' : ' primary'), text: kind === 'done' ? T.view : run ? T.continue : T.start, onClick: () => run ? openRun(run.id) : startRun(r) }));
      return h('li', { class: 't-row' }, ...kids);
    }
    function drawToday() {
      const body = $('today-body'), g = groupToday(routineList(), runList(), new Date(), ws());
      const none = !routineStore.records.length;
      $('empty').hidden = !none;
      $('notify-off').hidden = !notifyDenied || !S.value.notifyLate;
      tkit.clear(body);
      if (none) return;
      const sections = [['late', T.secLate, 'late'], ['open', T.secOpen, ''], ['today', T.secToday, '']];
      sections.forEach(([k, title, cls]) => {
        if (g[k].length) body.appendChild(h('section', {}, h('h2', { class: 'group-title ' + cls, text: title + ' (' + g[k].length + ')' }), h('ul', { class: 't-list' }, ...g[k].map(e => rowFor(e, k)))));
      });
      if (!g.late.length && !g.open.length && !g.today.length) {
        body.appendChild(h('t-state', { kind: 'empty', title: T.nothingTitle, text: T.nothingText }, h('button', { type: 'button', class: 't-button', text: T.navRoutines, onClick: () => { app.view = 'routines'; } })));
      }
      if (g.done.length) {
        const box = h('details', { class: 'done-group' }, h('summary', { class: 'group-title', text: T.secDone + ' (' + g.done.length + ')' }), h('ul', { class: 't-list' }, ...g.done.map(e => rowFor(e, 'done'))));
        box.open = doneOpen;
        box.addEventListener('toggle', () => { doneOpen = box.open; });
        body.appendChild(box);
      }
    }
    function setSummary() {
      if (!isReady() || app.view !== 'today') return;
      const g = groupToday(routineList(), runList(), new Date(), ws());
      tkit.context({ summary: T.summary(g.late.length, g.today.length, g.open.length) });
    }

    // ---- run screen (#run/<id>) -----------------------------------------------------------------
    // A tick is saved at once. On a conflict (another pane ticked meanwhile) the change is applied again to the newest copy.
    async function saveItems(rec, mutate) {
      let cur = rec;
      for (let attempt = 0; ; attempt++) {
        try { return await runsCol.update(cur.id, { items: mutate(cur.data.items.map(i => Object.assign({}, i))) }, { rev: cur.rev }); }
        catch (error) { if (error.code === 'conflict' && attempt < 2) cur = error.current; else throw error; }
      }
    }
    function drawRun() {
      if (!runId || !isReady()) return;
      const rec = runRec(runId);
      if (!rec) { tkit.toast(T.notFound); app.view = lastView; return; }
      const run = plain(rec), open = run.status === 'open', routine = routineList().find(r => r.id === run.routineId);
      $('run-title').textContent = run.routineName;
      const finished = open ? '' : ' · ' + T.finishedInfo(statusLabel(run.status), run.by, run.finishedAt ? tkit.date(run.finishedAt, 'time') : '');
      $('run-sub').textContent = periodText(routine, run.period) + finished;
      const check = $('run-check');
      check.readonly = !open;
      check.items = run.items.map(i => ({ id: i.stepId, label: i.label, done: i.done, required: i.required, note: [i.help, i.note].filter(Boolean).join(' · '), by: run.by, at: i.at }));
      const note = $('run-note');
      note.disabled = !open;
      if (document.activeElement !== note) note.value = run.note || '';
      $('run-note-btn').hidden = !open;
      $('run-bar').hidden = !open;
      const missing = missingRequired(run);
      $('run-finish').disabled = missing.length > 0;
      $('run-finish').title = missing.length ? T.missing(missing.map(i => i.label).join(', ')) : '';
      $('run-hint').textContent = missing.length ? T.missing(missing.map(i => i.label).join(', ')) : '';
      $('run-hint').hidden = !missing.length;
      const p = runProgress(run);
      setTimeout(() => tkit.context({ selection: T.runSel(run.routineName, routine && routine.frequency && routine.frequency.kind === 'daily' && run.period === clock().date ? T.todayWord : periodText(routine, run.period), p.done, p.total) }), 0);
    }
    $('run-check').addEventListener('t-toggle', async event => {
      const rec = runRec(runId), { id, done } = event.detail;
      if (!rec) return;
      try { await saveItems(rec, items => items.map(i => i.stepId === id ? Object.assign(i, { done, at: done ? nowIso() : null }) : i)); } catch (error) { fail(error); drawRun(); }
    });
    $('run-note').addEventListener('change', event => { runsCol.update(runId, { note: event.target.value }).catch(fail); });
    $('run-back').addEventListener('click', () => { app.view = lastView; });
    // Leaves the run screen once `job` worked. runId is cleared first so the live update does not say "not found".
    async function leaveAfter(job) {
      const id = runId;
      runId = null;
      try { await job(id); app.view = lastView; return true; } catch (error) { runId = id; fail(error); drawRun(); return false; }
    }
    $('run-finish').addEventListener('click', () => {
      const rec = runRec(runId);
      if (!rec || missingRequired(plain(rec)).length) return;
      leaveAfter(id => runsCol.update(id, { status: 'done', finishedAt: nowIso(), by: S.value.person || rec.data.by })).then(ok => { if (ok) tkit.toast(T.finishedToast, { tone: 'success' }); });
    });
    $('run-discard').addEventListener('click', async () => {
      if (runRec(runId) && await tkit.confirm(T.discardQ, { confirm: T.discard, tone: 'danger' })) leaveAfter(id => runsCol.remove(id));
    });
    $('run-skip').addEventListener('click', () => { $('skip-reason').value = ''; $('skip-modal').open(); });
    $('skip-cancel').addEventListener('click', () => $('skip-modal').close());
    $('skip-form').addEventListener('submit', event => {
      event.preventDefault();
      const rec = runRec(runId), note = $('skip-reason').value.trim();
      if (!rec) return;
      $('skip-modal').close();
      leaveAfter(id => runsCol.update(id, { status: 'skipped', finishedAt: nowIso(), note, by: S.value.person || rec.data.by }));
    });
    function fillNote() {
      const rec = runRec(runId), item = rec && rec.data.items.find(i => i.stepId === $('note-step').value);
      $('note-text').value = item ? item.note || '' : '';
    }
    $('run-note-btn').addEventListener('click', () => {
      const rec = runRec(runId);
      if (!rec) return;
      const select = $('note-step');
      tkit.clear(select);
      rec.data.items.forEach(i => select.appendChild(h('option', { value: i.stepId, text: i.label })));
      fillNote();
      $('note-modal').open();
    });
    $('note-step').addEventListener('change', fillNote);
    $('note-cancel').addEventListener('click', () => $('note-modal').close());
    $('note-form').addEventListener('submit', async event => {
      event.preventDefault();
      const rec = runRec(runId), stepId = $('note-step').value, text = $('note-text').value.trim();
      if (!rec) return;
      try { await saveItems(rec, items => items.map(i => i.stepId === stepId ? Object.assign(i, { note: text }) : i)); $('note-modal').close(); } catch (error) { fail(error); }
    });
    hold($('skip-modal')); hold($('note-modal'));
    function syncRoute(route) {
      if (route.view !== 'run') { lastView = route.view || 'today'; runId = null; return; }
      if (!route.id) { app.view = lastView; return; }
      runId = route.id;
      drawRun();
    }

    // ---- routines: list and editor -----------------------------------------------------------------
    function drawRoutines() {
      const box = $('routine-list'), list = routineList(), runs = runList();
      tkit.clear(box);
      if (!list.length) { box.appendChild(h('t-state', { kind: 'empty', title: T.emptyTitle, text: T.emptyText })); return; }
      const c = clock();
      const rows = list.map(r => {
        const next = nextDue(r, new Date(), runs, ws());
        const nextText = r.active === false ? T.paused : next ? T.next(next === c.date ? T.todayWord : tkit.date(next)) : '';
        const toggle = h('input', { type: 'checkbox', class: 't-switch', checked: r.active !== false, 'aria-label': T.active + ': ' + r.name });
        toggle.addEventListener('change', () => { const rec = routineStore.records.find(x => x.id === r.id); routinesCol.update(r.id, { active: toggle.checked }, { rev: rec.rev }).catch(error => { fail(error); drawRoutines(); }); });
        return h('li', { class: 't-row' }, toggle,
          h('button', { type: 'button', class: 'row-link', onClick: () => openRoutine(routineStore.records.find(x => x.id === r.id)) },
            h('strong', { text: r.name }), h('small', { text: [freqText(r), T.stepsN((r.steps || []).length), nextText, r.owner].filter(Boolean).join(' · ') })),
          h('button', { type: 'button', class: 't-button', text: T.start, disabled: r.active === false, onClick: () => startRun(r) }));
      });
      box.appendChild(h('ul', { class: 't-list' }, ...rows));
    }
    const newStep = () => ({ id: 's_' + tkit.uid(), label: '', required: false });
    function drawEditor() {
      document.querySelectorAll('#r-kind button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === draft.kind)));
      $('r-weekly').hidden = draft.kind !== 'weekly';
      $('r-monthly').hidden = draft.kind !== 'monthly';
      $('r-once').hidden = draft.kind !== 'once';
      $('r-time-field').hidden = draft.kind === 'manual';
      const days = $('r-days');
      tkit.clear(days);
      for (let i = 0; i < 7; i++) {
        const d = (ws() + i) % 7;
        days.appendChild(h('button', { type: 'button', class: 't-button small', text: T.dayShort[d], 'aria-pressed': String(draft.weekdays.indexOf(d) >= 0), onClick: () => {
          draft.weekdays = draft.weekdays.indexOf(d) >= 0 ? draft.weekdays.filter(x => x !== d) : draft.weekdays.concat(d);
          drawEditor();
        } }));
      }
      const list = $('steps-list');
      tkit.clear(list);
      // KIT-CANDIDATE: <t-list-editor> with an extra "required" switch per row (steps are label + required); built here until the kit has it.
      draft.steps.forEach((s, i) => {
        const input = h('input', { type: 'text', class: 't-input', value: s.label, placeholder: T.stepPlaceholder, 'aria-label': T.stepN(i + 1) });
        input.addEventListener('input', () => { s.label = input.value; });
        const req = h('input', { type: 'checkbox', class: 't-switch', checked: !!s.required, 'aria-label': T.required + ': ' + T.stepN(i + 1) });
        req.addEventListener('change', () => { s.required = req.checked; });
        const move = (by, label) => h('button', { type: 'button', class: 't-icon-button', 'aria-label': label, disabled: i + by < 0 || i + by >= draft.steps.length, onClick: () => { draft.steps.splice(i + by, 0, draft.steps.splice(i, 1)[0]); drawEditor(); } }, h('span', { class: by < 0 ? 'flip' : '' }, tkit.icon('chevron-down', 16)));
        const del = h('button', { type: 'button', class: 't-icon-button', 'aria-label': T.delete, onClick: () => { draft.steps.splice(i, 1); drawEditor(); } }, tkit.icon('trash', 16));
        list.appendChild(h('div', { class: 'step-row' }, input, h('span', { class: 'step-tools' }, h('label', { class: 't-switch-line' }, req, h('span', { text: T.required })), move(-1, T.moveUp), move(1, T.moveDown), del)));
      });
    }
    function openRoutine(rec) {
      editing = rec || null;
      const r = rec ? rec.data : {}, f = r.frequency || { kind: 'daily' };
      draft = { kind: f.kind, weekdays: (f.weekdays || [1]).slice(), steps: (r.steps || []).map(s => Object.assign({}, s)) };
      if (!draft.steps.length) draft.steps.push(newStep());
      $('r-name').value = r.name || '';
      $('r-description').value = r.description || '';
      $('r-owner').value = r.owner || '';
      $('r-day').value = f.day || 1;
      $('r-date').value = f.date || clock().date;
      $('r-time').value = r.dueTime || '';
      $('r-delete').hidden = !rec;
      $('routine-modal').title = rec ? T.editRoutine : T.newRoutineTitle;
      drawEditor();
      $('routine-modal').open();
    }
    document.querySelectorAll('.new-routine').forEach(b => b.addEventListener('click', () => openRoutine(null)));
    $('r-kind').addEventListener('click', event => { const b = event.target.closest('button[data-kind]'); if (b) { draft.kind = b.dataset.kind; drawEditor(); } });
    $('add-step').addEventListener('click', () => { draft.steps.push(newStep()); drawEditor(); const inputs = $('steps-list').querySelectorAll('input[type=text]'); inputs[inputs.length - 1].focus(); });
    $('r-cancel').addEventListener('click', () => $('routine-modal').close());
    hold($('routine-modal'));
    $('routine-form').addEventListener('submit', async event => {
      event.preventDefault();
      const name = $('r-name').value.trim(), steps = draft.steps.map(s => Object.assign({}, s, { label: s.label.trim() })).filter(s => s.label);
      if (!name) { $('r-name').focus(); return fail(new Error(T.needName)); }
      if (!steps.length) return fail(new Error(T.needStep));
      const frequency = { kind: draft.kind };
      if (draft.kind === 'weekly') frequency.weekdays = draft.weekdays.length ? draft.weekdays.slice().sort() : [1];
      if (draft.kind === 'monthly') frequency.day = Math.min(31, Math.max(1, parseInt($('r-day').value, 10) || 1));
      if (draft.kind === 'once') { frequency.date = $('r-date').value; if (!frequency.date) return fail(new Error(T.needDate)); }
      const data = { name, description: $('r-description').value.trim(), owner: $('r-owner').value.trim(), steps, frequency, dueTime: draft.kind !== 'manual' && $('r-time').value ? $('r-time').value : null };
      $('r-save').disabled = true;
      try {
        if (editing) await routinesCol.update(editing.id, data, { rev: editing.rev });
        else await routinesCol.insert(Object.assign(data, { active: true, order: Math.max(0, ...routineStore.records.map(r => r.data.order || 0)) + 1 }));
        $('routine-modal').close();
      } catch (error) {
        if (error.code === 'conflict') { tkit.toast(T.conflict, { tone: 'error' }); openRoutine(error.current); } else fail(error);
      } finally { $('r-save').disabled = false; }
    });
    $('r-delete').addEventListener('click', async () => {
      if (!editing || !await tkit.confirm(T.deleteQ(editing.data.name), { confirm: T.delete, tone: 'danger' })) return;
      try {
        for (const r of runStore.records.filter(x => x.data.routineId === editing.id && x.data.status === 'open')) await runsCol.remove(r.id);
        await routinesCol.remove(editing.id);
        $('routine-modal').close();
      } catch (error) { fail(error); }
    });

    // ---- history ------------------------------------------------------------------------------------
    function drawHistory() {
      const table = $('hist-table'), pills = $('hist-pills'), runs = runList().sort((a, b) => String(b.startedAt).localeCompare(String(a.startedAt)));
      table.columns = [{ key: 'routine', label: T.cRoutine }, { key: 'period', label: T.cPeriod, type: 'date' }, { key: 'status', label: T.cStatus, type: 'badge', tones: { [T.sDone]: 'ok', [T.sSkipped]: 'warn', [T.sOpen]: 'accent' } },
        { key: 'by', label: T.cBy }, { key: 'finished', label: T.cFinished }, { key: 'items', label: T.cItems }];
      table.rows = runs.map(r => { const p = runProgress(r); return { id: r.id, routineId: r.routineId, routine: r.routineName, period: r.period, status: statusLabel(r.status), by: r.by || '', finished: r.finishedAt ? tkit.date(r.finishedAt, 'time') : '', items: p.done + ' / ' + p.total }; });
      const names = {};
      runs.forEach(r => { names[r.routineId] = r.routineName; });
      pills.options = [{ value: '', label: T.all, count: runs.length }].concat(Object.keys(names).map(id => ({ value: id, label: names[id], count: runs.filter(r => r.routineId === id).length })));
    }
    $('hist-pills').value = '';
    $('hist-pills').addEventListener('t-change', event => { const id = event.detail.value; $('hist-table').filter = id ? row => row.routineId === id : null; });
    $('hist-table').addEventListener('t-open', event => openRun(event.detail.id));

    // ---- settings -------------------------------------------------------------------------------------
    const tools = $('tools');
    $('person').addEventListener('change', event => { S.save({ person: event.target.value.trim() }).catch(fail); });
    $('notify-late').addEventListener('change', event => { S.save({ notifyLate: event.target.checked }).catch(fail); });
    $('week-start').addEventListener('click', event => { const b = event.target.closest('button[data-ws]'); if (b) S.save({ weekStart: +b.dataset.ws }).catch(fail); });
    function applySettings() {
      const v = S.value;
      if (document.activeElement !== $('person')) $('person').value = v.person;
      $('notify-late').checked = v.notifyLate;
      document.querySelectorAll('#week-start button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.ws === v.weekStart)));
      if (isReady()) render();
    }
    tools.noun = T.noun;
    tools.filename = T.csvName;
    tools.fields = [];
    tools.exportRows = records => records.map(r => r.data).sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)));
    tools.exportColumns = () => [
      { key: 'routineName', label: T.cRoutine }, { key: 'period', label: T.cPeriod }, { key: 'status', label: T.cStatus, format: statusLabel }, { key: 'by', label: T.cBy },
      { key: 'startedAt', label: T.cStarted }, { key: 'finishedAt', label: T.cFinished, format: v => v || '' },
      { key: 'items', label: T.cDone, format: items => (items || []).filter(i => i.done).length }, { key: 'items', label: T.cTotal, format: items => (items || []).length }, { key: 'note', label: T.cNote }];

    // ---- late notifications (at most once a day, only with the permission) ---------------------------------
    async function checkLate() {
      if (!S || !isReady() || notifying || notifyDenied) return;
      const g = groupToday(routineList(), runList(), new Date(), ws()), today = clock().date;
      if (!shouldNotify(S.value, g.late, today)) return;
      notifying = true;
      try {
        await tendly.host.notify(T.notifyTitle, T.notifyBody(g.late.length, g.late.slice(0, 3).map(e => e.routine.name)));
        await S.save({ lastNotified: today });
      } catch (error) { if (error && error.code === 'permission') { notifyDenied = true; drawToday(); } }
      finally { notifying = false; }
    }

    // ---- examples ---------------------------------------------------------------------------------------
    const iso = (daysAgo, hour, minute) => { const d = new Date(); d.setDate(d.getDate() - daysAgo); d.setHours(hour, minute, 0, 0); return d.toISOString(); };
    // Adds the example routines (marked _sample) and returns the example runs for the caller to insert.
    async function buildExamples() {
      const ex = T.examples, made = [];
      for (const e of ex.routines) {
        const rec = await routinesCol.insert({ name: e.name, description: e.description, owner: e.owner, frequency: e.frequency, dueTime: e.dueTime, active: true, order: made.length + 1, _sample: true,
          steps: e.steps.map((label, i) => ({ id: 's' + (i + 1), label, required: e.required.indexOf(i) >= 0 })) });
        made.push(plain(rec));
      }
      const run = (r, daysAgo, status, doneCount, extra) => {
        const items = r.steps.map((s, i) => ({ stepId: s.id, label: s.label, required: s.required, done: i < doneCount, at: i < doneCount ? iso(daysAgo, 8 + Math.floor(i / 3), 35 + i) : null, note: '' }));
        const base = { routineId: r.id, routineName: r.name, period: runPeriodFor(r, clockOf(new Date(iso(daysAgo, 12, 0))).date, ws()), startedAt: iso(daysAgo, 8, 30), by: ex.people[daysAgo % ex.people.length], items, status, note: '', finishedAt: status === 'open' ? null : iso(daysAgo, 9, 5) };
        return Object.assign(base, extra || {});
      };
      const [open, ext, close] = made;
      return [run(open, 0, 'open', 3), run(open, 1, 'done', open.steps.length), run(open, 2, 'done', open.steps.length), run(open, 3, 'skipped', 0, { note: ex.skipReason }), run(open, 4, 'done', open.steps.length),
        run(ext, 7, 'done', ext.steps.length), run(close, 9, 'done', close.steps.length)];
    }
    async function loadExamples() { try { await tkit.samples.load(runsCol, await buildExamples()); } catch (error) { fail(error); } }
    async function clearExamples() { try { await tkit.samples.clear(runsCol); await tkit.samples.clear(routinesCol); } catch (error) { fail(error); } }
    tools.examples = buildExamples;
    tools.addEventListener('t-examples', event => { if (event.detail.action === 'cleared') tkit.samples.clear(routinesCol).catch(fail); });
    $('empty').addEventListener('t-action', () => openRoutine(null));
    $('empty').addEventListener('t-examples', loadExamples);
    document.querySelectorAll('t-sample-banner').forEach(b => b.addEventListener('t-clear', clearExamples));

    // ---- render and start-up ------------------------------------------------------------------------------
    function render() {
      if (!isReady()) return;
      drawToday(); drawRoutines(); drawHistory(); drawRun(); setSummary();
      const examples = tkit.samples.count(runStore.records) + tkit.samples.count(routineStore.records);
      document.querySelectorAll('t-sample-banner').forEach(b => { b.count = examples; });
      tools.records = runStore.records;
    }
    app.addEventListener('t-view', () => setTimeout(setSummary, 0));
    tkit.route.on(syncRoute);
    (async () => {
      S = await tkit.settings('settings', DEFAULTS);
      if (S.error) fail(S.error);
      S.on(applySettings);
      tools.collection = runsCol;
      try { const p = await tendly.permissions.get(); if (p && Array.isArray(p.refused) && p.refused.indexOf('notify') >= 0) notifyDenied = true; } catch (_) { /* outside Tendly: no bell */ }
      const onError = error => { $('today-body').replaceChildren(h('t-state', { kind: 'error', title: T.loadFail, text: error.message }, h('button', { type: 'button', class: 't-button', text: T.retry, onClick: () => { routineStore.reload(); runStore.reload(); } }))); };
      routineStore = tkit.live(routinesCol, () => { ready.routines = true; render(); }, { limit: 5000, onError });
      runStore = tkit.live(runsCol, () => { ready.runs = true; render(); }, { limit: 5000, onError });
      applySettings();
      await Promise.all([routineStore.ready, runStore.ready]);
      syncRoute(tkit.route.get());
      checkLate();
      setInterval(checkLate, 600000);
      setInterval(() => { if (isReady()) { drawToday(); drawRoutines(); setSummary(); } }, 60000);
    })();
  </script>
</body>
</html>
