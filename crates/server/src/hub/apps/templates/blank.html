<!doctype html>
<html lang="en" data-app-color="{{COLOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="stylesheet" href="/api/hub/apps/kit.css">
  <script src="/api/hub/apps/sdk.js"></script>
  <script src="/api/hub/apps/kit.js"></script>
  <style>
    /* The app's own styles go here. Colours, type and spacing: the --t-* variables of kit.css. */
    .intro { max-width: 640px; }
  </style>
</head>
<body>
  <main class="t-page">
    <header class="t-page-head">
      <div class="t-toolbar">
        <span class="t-tile" aria-hidden="true">{{LETTER}}</span>
        <div>
          <h1 class="t-title">{{NAME}}</h1>
          <p class="t-muted">{{DESCRIPTION}}</p>
        </div>
      </div>
    </header>

    <section class="t-card intro">
      <h2>A list kept by Tendly</h2>
      <p class="t-muted">Each item below is a record of the collection "items": it stays after a reload, and two open panes of this app see the same list. Ask your agent to turn this page into what you need.</p>
      <form id="add" class="t-toolbar">
        <input id="text" class="t-input" type="text" placeholder="Something to keep" aria-label="Something to keep" maxlength="200" required style="flex: 1 1 200px">
        <button type="submit" class="t-button primary">Add</button>
      </form>
    </section>

    <div id="items"></div>
  </main>

  <script>
    const items = tendly.db.collection('items');
    const list = document.getElementById('items');
    const fail = error => tkit.toast(error && error.message ? error.message : String(error), { tone: 'error' });

    function render(records) {
      tkit.clear(list);
      if (!records.length) {
        list.appendChild(tkit.h('t-state', { kind: 'empty', title: 'Nothing kept yet', text: 'Add the first item above.' }));
        return;
      }
      const ul = tkit.h('ul', { class: 't-list' });
      records.forEach(record => {
        const remove = tkit.h('button', { type: 'button', class: 't-icon-button', 'aria-label': 'Remove ' + record.data.text, onClick: async () => {
          if (!await tkit.confirm('Remove "' + record.data.text + '"?', { confirm: 'Remove', tone: 'danger' })) return;
          try { await items.remove(record.id); } catch (error) { fail(error); }
        } }, tkit.icon('trash', 15));
        ul.appendChild(tkit.h('li', { class: 't-row' },
          tkit.h('div', { class: 't-row-text' }, tkit.h('span', { text: record.data.text }), tkit.h('small', { text: tkit.ago(record.created_at) })),
          remove));
      });
      list.appendChild(ul);
    }

    document.getElementById('add').addEventListener('submit', async event => {
      event.preventDefault();
      const field = document.getElementById('text');
      const text = field.value.trim();
      if (!text) return;
      try { await items.insert({ text }); field.value = ''; field.focus(); tendly.host.holdReload(false); } catch (error) { fail(error); }
    });
    // While something is typed and not yet added, Tendly waits before reloading the app after a change.
    document.getElementById('text').addEventListener('input', event => {
      if (event.target.value.trim()) tendly.host.holdReload(true); else tendly.host.holdReload(false);
    });

    list.appendChild(tkit.h('t-state', { kind: 'loading' }));
    tkit.live(items, render, { order: '-created_at', onError: error => {
      tkit.clear(list);
      list.appendChild(tkit.h('t-state', { kind: 'error', title: 'Could not load the list', text: error.message }));
    } });
  </script>
</body>
</html>
