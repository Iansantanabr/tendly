<!doctype html>
<html lang="pt-BR" data-app-color="{{COLOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="stylesheet" href="/api/hub/apps/kit.css">
  <script src="/api/hub/apps/sdk.js"></script>
  <script src="/api/hub/apps/kit.js"></script>
  <style>
    .form-card { max-width: 560px; }
    .form-card > .t-actions { margin-top: var(--t-space-3); }
    .intro { margin: 0; white-space: pre-wrap; }
    .settings-page { max-width: 760px; }
    .settings-note { margin: 0 0 var(--t-space-3); }
    .status-pick { display: inline-grid; gap: 2px; margin-right: auto; }
  </style>
</head>
<body>
  <t-app>
    <t-nav label="Seções">
      <span class="t-nav-title"><span class="t-tile" aria-hidden="true">{{LETTER}}</span><span>{{NAME}}</span></span>
      <button data-view="form" data-icon="form">Formulário</button>
      <button data-view="list" data-icon="inbox">Envios</button>
      <button data-view="settings" data-icon="settings" class="t-nav-end">Ajustes</button>
    </t-nav>
    <main class="t-app-main">
      <t-view name="form">
        <div class="t-page">
          <header class="t-page-head"><div><h1 class="t-title" id="form-title">{{NAME}}</h1><p class="t-muted">{{DESCRIPTION}}</p></div></header>
          <div id="form-slot"><t-state kind="loading"></t-state></div>
        </div>
      </t-view>

      <t-view name="list">
        <div class="t-page wide">
          <header class="t-page-head"><h1 class="t-title">Envios</h1><span class="t-badge" id="count"></span></header>
          <t-sample-banner id="banner"></t-sample-banner>
          <div id="list-state"><t-state kind="loading"></t-state></div>
          <t-empty-start id="empty" hidden title="Nenhum envio ainda" text="Quando alguém preencher o formulário, a resposta aparece aqui." action="Abrir o formulário"></t-empty-start>
          <div id="list-body" hidden>
            <t-pills id="status-filter"></t-pills>
            <t-table id="table" searchable empty-text="Nada encontrado"></t-table>
          </div>
          <t-detail id="detail">
            <label class="t-field status-pick" slot="actions"><span>Status</span><select id="status-select"></select></label>
            <button type="button" class="t-button" slot="actions" id="copy-answers">Copiar respostas</button>
            <button type="button" class="t-button danger" slot="actions" id="delete-one">Apagar</button>
          </t-detail>
        </div>
      </t-view>

      <t-view name="settings">
        <div class="t-page settings-page">
          <header class="t-page-head"><h1 class="t-title">Ajustes</h1></header>

          <section class="t-card t-form">
            <div class="t-card-head"><h2>Formulário</h2></div>
            <label class="t-field"><span>Título</span><input type="text" id="set-title" maxlength="120"></label>
            <label class="t-field"><span>Introdução</span><textarea id="set-intro" maxlength="1000" placeholder="Um texto curto acima dos campos (opcional)"></textarea></label>
            <label class="t-field"><span>Mensagem depois de enviar</span><input type="text" id="set-thanks" maxlength="300"></label>
          </section>

          <section class="t-card">
            <div class="t-card-head"><h2>Campos</h2></div>
            <p class="t-muted settings-note">O que as pessoas preenchem. Renomear um campo mantém as respostas; apagar um só o esconde, as respostas continuam salvas.</p>
            <t-fields-editor id="fields-editor" types="text,longtext,number,money,date,datetime,choice,multi,checkbox,image,file,url,email,phone"></t-fields-editor>
          </section>

          <section class="t-card">
            <div class="t-card-head"><h2>Status</h2></div>
            <p class="t-muted settings-note">Como você acompanha cada envio. Os envios novos começam no primeiro status.</p>
            <t-list-editor id="status-editor" tones></t-list-editor>
          </section>

          <t-data-tools id="tools"></t-data-tools>
        </div>
      </t-view>
    </main>
  </t-app>

  <script>
    // READING ORDER: constants and defaults -> state -> helpers -> render functions -> handlers -> start-up.
    // Data: submissions are records in the collection "submissions" (data = one answer per field id, plus
    // `status`); the form's own setup (title, fields, statuses...) is ONE value in tendly.data, key "settings".
    // Field ids never change once made (labels can). Old submissions have no `status`: they count as the first one.

    // ---- Constants and defaults ----
    const submissions = tendly.db.collection('submissions');
    const DEFAULTS = {
      v: 1,
      title: '',   // empty = the app's name (read from the page's <h1> at start-up)
      intro: '',
      thanks: 'Recebido. Obrigado!',
      fields: [
        { id: 'name', label: 'Nome', type: 'text', required: true },
        { id: 'email', label: 'E-mail', type: 'email' },
        { id: 'phone', label: 'Telefone', type: 'phone' },
        { id: 'subject', label: 'Assunto', type: 'choice', required: true, options: [
          { id: 'question', label: 'Dúvida' }, { id: 'request', label: 'Pedido' },
          { id: 'feedback', label: 'Sugestão' }, { id: 'other', label: 'Outro' }] },
        { id: 'message', label: 'Mensagem', type: 'longtext', required: true }
      ],
      statuses: [
        { id: 'new', label: 'Novo', tone: 'accent' },
        { id: 'seen', label: 'Visto', tone: '' },
        { id: 'done', label: 'Resolvido', tone: 'ok' }
      ]
    };
    // Submissions made before the form had a schema stored the subject as the option's text, in either language.
    const LEGACY_SUBJECT = { question: 'question', duvida: 'question', request: 'request', pedido: 'request', feedback: 'feedback', sugestao: 'feedback', other: 'other', outro: 'other' };
    const RESERVED_IDS = ['status', '_sample'];   // keys of a record the form owns: no field may take them
    const TEXT = {
      someoneChanged: 'Alguém mudou isto enquanto isso; recarreguei.',
      keepOneStatus: 'Mantenha pelo menos um status.'
    };

    // ---- State ----
    const appName = (document.getElementById('form-title').textContent || '').trim();
    const $ = id => document.getElementById(id);
    const rf = tkit.h('t-record-form');
    const table = $('table'), pills = $('status-filter'), banner = $('banner'), detail = $('detail');
    const fieldsEditor = $('fields-editor'), statusEditor = $('status-editor'), tools = $('tools'), empty = $('empty');
    const fail = error => tkit.toast(error && error.message ? error.message : String(error), { tone: 'error' });
    let S, store, viewingId = null, wantedId = null, statusFilter = '', loaded = false, lastFieldsJson = '', lastUseJson = '';

    // ---- Helpers ----
    const statusesOf = () => S.value.statuses;
    function statusOf(data) {   // the status option of a record; a missing or removed one counts as the first
      const list = statusesOf();
      return list.find(s => s.id === (data || {}).status) || list[0];
    }
    function statusField() { return { id: 'status', label: 'Status', type: 'choice', options: statusesOf() }; }
    function shaped(record) {   // the record as the page shows it: subject by option id, status resolved
      const data = Object.assign({}, record.data);
      S.value.fields.forEach(field => {
        if (field.type !== 'choice' || field.id !== 'subject' || !data[field.id]) return;
        const known = field.options.some(o => o.id === data[field.id]);
        const alias = LEGACY_SUBJECT[tkit.fold(String(data[field.id]))];
        if (!known && alias && field.options.some(o => o.id === alias)) data[field.id] = alias;
      });
      data.status = statusOf(data).id;
      return Object.assign({}, record, { data });
    }
    const records = () => (store ? store.records : []).map(shaped);
    const optionFor = (field, value) => (field.options || []).find(o => o.id === value || tkit.fold(o.label) === tkit.fold(String(value)));
    function badge(tone, label) { return tkit.h('span', { class: 't-badge' + (tone ? ' ' + tone : ''), text: label }); }
    function countText(n) { return n + (n === 1 ? ' envio' : ' envios'); }
    function summaryText(list) {
      const fresh = list.filter(r => r.data.status === statusesOf()[0].id).length;
      return 'Formulário: ' + list.length + (list.length === 1 ? ' resposta' : ' respostas') + ', ' + fresh + (fresh === 1 ? ' nova' : ' novas');
    }
    function updateSummary() { tkit.context({ summary: summaryText(records()) }); }
    function localDate(iso) {
      const d = new Date(iso);
      return isNaN(d.getTime()) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function usage(list) {   // how many records hold a value per field, per option, per status
      const fields = {}, options = {}, statuses = {};
      list.forEach(r => {
        statuses[r.data.status] = (statuses[r.data.status] || 0) + 1;
        S.value.fields.forEach(f => {
          const v = r.data[f.id];
          if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) return;
          fields[f.id] = (fields[f.id] || 0) + 1;
          if (f.type === 'choice' || f.type === 'multi') {
            options[f.id] = options[f.id] || {};
            (Array.isArray(v) ? v : [v]).forEach(o => { options[f.id][o] = (options[f.id][o] || 0) + 1; });
          }
        });
      });
      return { fields, options, statuses };
    }

    // ---- Render: form view ----
    function syncForm() {   // title, intro and fields follow the settings (the form keeps what was typed unless the fields change)
      const s = S.value;
      $('form-title').textContent = s.title || appName;
      rf.settings = {};
      const json = JSON.stringify(s.fields);
      if (json !== lastFieldsJson) { lastFieldsJson = json; rf.fields = s.fields; }
      const intro = $('intro');
      if (intro) { intro.textContent = s.intro; intro.hidden = !s.intro; }
    }
    function renderFormView() {   // (re)builds the card with the form; "Send another" comes back here
      const slot = $('form-slot');
      syncForm();
      tkit.clear(slot);
      const intro = tkit.h('p', { class: 'intro', id: 'intro', text: S.value.intro });
      intro.hidden = !S.value.intro;
      slot.appendChild(tkit.h('div', { class: 't-card form-card', id: 'fill-card' },
        intro, rf,
        tkit.h('div', { class: 't-actions' },
          tkit.h('button', { type: 'button', class: 't-button', text: 'Limpar', onClick: () => { rf.value = {}; tendly.host.holdReload(false); } }),
          tkit.h('button', { type: 'button', class: 't-button primary', id: 'send', text: 'Enviar', onClick: send }))));
    }
    async function send() {
      const button = $('send');
      let data;
      try { data = await rf.submit(); } catch (error) { if (error.code !== 'invalid') fail(error); return; }
      button.disabled = true;
      try {
        await submissions.insert(Object.assign({}, data, { status: statusesOf()[0].id }));
        rf.value = {};
        tendly.host.holdReload(false);
        const slot = $('form-slot');
        tkit.clear(slot);
        slot.appendChild(tkit.h('div', { class: 't-card form-card' },
          tkit.h('t-state', { kind: 'empty', title: S.value.thanks || DEFAULTS.thanks },
            tkit.h('button', { type: 'button', class: 't-button primary', text: 'Enviar outro', onClick: renderFormView }))));
      } catch (error) { fail(error); button.disabled = false; }
    }

    // ---- Render: submissions view ----
    function rowOf(record) {
      const row = { id: record.id, _data: record.data, _status: statusOf(record.data).label, _received: record.created_at };
      S.value.fields.forEach(f => { row['f:' + f.id] = tkit.fieldText(f, record.data[f.id], {}); });
      return row;
    }
    function tableColumns() {
      const shown = S.value.fields.filter(f => f.type !== 'longtext' && f.type !== 'image' && f.type !== 'file').slice(0, 4);
      const cols = shown.map(field => ({
        key: 'f:' + field.id, label: field.label,
        format: (text, row) => {
          const option = field.type === 'choice' ? optionFor(field, row._data[field.id]) : null;
          return option ? badge(option.tone, option.label) : text;
        }
      }));
      cols.push({ key: '_status', label: 'Status', format: (text, row) => badge(statusOf(row._data).tone, text) });
      cols.push({ key: '_received', label: 'Recebido', format: v => tkit.date(v, 'time') });
      return cols;
    }
    function renderList() {
      const list = records(), state = $('list-state'), body = $('list-body');
      $('count').textContent = countText(list.length);
      banner.count = tkit.samples.count(store.records);
      tkit.clear(state);
      empty.hidden = list.length > 0;
      body.hidden = !list.length;
      if (!list.length) return;
      if (statusFilter && !statusesOf().some(s => s.id === statusFilter)) statusFilter = '';
      pills.options = [{ value: '', label: 'Todos', count: list.length }].concat(statusesOf().map(s => ({ value: s.id, label: s.label, count: list.filter(r => r.data.status === s.id).length })));
      pills.value = statusFilter;
      table.columns = tableColumns();
      table.rows = list.map(rowOf);
      table.filter = statusFilter ? row => row._data.status === statusFilter : null;
    }
    function renderSettings() {
      const s = S.value, list = records(), use = usage(list);
      const useJson = JSON.stringify(use.options);
      if (useJson !== lastUseJson) { lastUseJson = useJson; fieldsEditor.optionsInUse = use.options; }
      fieldsEditor.inUse = use.fields;
      statusEditor.inUse = use.statuses;
      tools.fields = detailFields();
      tools.records = store ? store.records : [];
    }
    function render() {
      if (!store) return;
      loaded = true;
      renderList();
      renderSettings();
      updateSummary();
      refreshDetail();
      applyRoute();
    }

    // ---- Detail (a drawer; the address is #list/<id>) ----
    function detailFields() { return S.value.fields.concat([statusField()]); }
    function showDetail(record) {
      viewingId = record.id;
      detail.settings = {};
      detail.siblings = table.visible().map(r => r.id);
      fillDetail(record);
      detail.open();
    }
    function fillDetail(record) {
      detail.fields = detailFields();
      detail.record = record;
      const select = $('status-select');
      tkit.clear(select);
      statusesOf().forEach(s => select.appendChild(tkit.h('option', { value: s.id, text: s.label })));
      select.value = record.data.status;
    }
    function refreshDetail() {
      if (!detail.opened || !viewingId) return;
      const record = records().find(r => r.id === viewingId);
      if (!record) { detail.close(); return; }
      fillDetail(record);
    }
    function applyRoute() {   // open the record named in the address, once the data is here
      if (!loaded) return;
      if (wantedId) {
        if (detail.opened && detail.record && detail.record.id === wantedId) return;
        const record = records().find(r => r.id === wantedId);
        if (record) showDetail(record);
      } else if (detail.opened) detail.close();
    }
    function answersText(record) {
      const lines = S.value.fields.map(f => [f.label, tkit.fieldText(f, record.data[f.id], {})]).filter(pair => pair[1]).map(pair => pair[0] + ': ' + pair[1]);
      lines.push('Status: ' + statusOf(record.data).label, 'Recebido: ' + tkit.date(record.created_at, 'time'));
      return lines.join('\n');
    }
    const viewing = () => records().find(r => r.id === viewingId);

    // ---- Data actions ----
    function sampleDocs() {   // made-up, in the default field ids; statuses are ids of the default statuses
      const rows = [
        ['Maria Santos', 'maria@example.com', '(11) 5550-2001', 'question', 'Vocês entregam aos sábados? Queria encomendar para um evento pequeno.', 'new'],
        ['Carlos Pereira', 'carlos@example.com', '(11) 5550-2002', 'request', 'Podem me enviar um orçamento para 40 unidades? Preciso até o fim do mês.', 'new'],
        ['Ana Oliveira', 'ana@example.com', '', 'feedback', 'Atendimento ótimo, a equipe respondeu em minutos. Obrigada!', 'done'],
        ['João Lima', 'joao@example.com', '(11) 5550-2004', 'question', 'Dá para mudar o endereço de entrega depois de fazer o pedido?', 'seen'],
        ['Fernanda Costa', 'fernanda@example.com', '(11) 5550-2005', 'other', 'Gostaria de conversar sobre uma parceria. Com quem posso falar?', 'seen'],
        ['Rafael Souza', '', '(11) 5550-2006', 'request', 'Por favor, me liguem depois das 14h, tenho algumas dúvidas sobre os planos.', 'new'],
        ['Juliana Martins', 'juliana@example.com', '', 'feedback', 'O formulário do site é fácil, mas não consegui anexar uma foto.', 'done']
      ];
      return rows.map(r => ({ name: r[0], email: r[1], phone: r[2], subject: r[3], message: r[4], status: r[5] }));
    }
    // ---- Handlers ----
    rf.addEventListener('t-input', () => { tendly.host.holdReload(true); });
    pills.addEventListener('t-change', event => {
      statusFilter = event.detail.value || '';
      table.filter = statusFilter ? row => row._data.status === statusFilter : null;
    });
    table.addEventListener('t-open', event => { const r = records().find(x => x.id === event.detail.id); if (r) showDetail(r); });
    detail.addEventListener('t-nav', event => { const r = records().find(x => x.id === event.detail.id); if (r) showDetail(r); });
    detail.addEventListener('t-close', () => { viewingId = null; });
    $('status-select').addEventListener('change', async event => {
      const raw = store.records.find(r => r.id === viewingId);
      if (!raw) return;
      try { await submissions.update(raw.id, { status: event.target.value }, { rev: raw.rev }); }
      catch (error) {
        if (error.code === 'conflict') { tkit.toast(TEXT.someoneChanged, { tone: 'error' }); store.reload(); } else fail(error);
        refreshDetail();
      }
    });
    $('copy-answers').addEventListener('click', async () => {
      const record = viewing();
      if (record && !await tkit.copy(answersText(record))) tkit.toast('Não deu para copiar.', { tone: 'error' });
    });
    $('delete-one').addEventListener('click', async () => {
      const record = viewing();
      if (!record || !await tkit.confirm('Apagar este envio?', { confirm: 'Apagar', tone: 'danger' })) return;
      try { await submissions.remove(record.id); detail.close(); } catch (error) { fail(error); }
    });
    banner.addEventListener('t-clear', () => tkit.samples.clear(submissions).catch(fail));
    empty.addEventListener('t-action', () => { document.querySelector('t-app').view = 'form'; });
    empty.addEventListener('t-examples', () => tkit.samples.load(submissions, sampleDocs()).catch(fail));

    // Settings inputs save on change (not per keystroke); the editors save on their own t-change.
    [['set-title', 'title'], ['set-intro', 'intro'], ['set-thanks', 'thanks']].forEach(([id, key]) => {
      $(id).addEventListener('change', () => { S.save({ [key]: $(id).value.trim() }).catch(fail); });
    });
    fieldsEditor.addEventListener('t-change', event => {
      // `status` belongs to the record itself: a field that would take that id gets another one.
      const taken = event.detail.fields.map(f => f.id);
      let renamed = false;
      const fields = event.detail.fields.map(f => {
        if (RESERVED_IDS.indexOf(f.id) < 0) return f;
        renamed = true;
        return Object.assign({}, f, { id: tkit.slug(f.id + ' 2', taken) });
      });
      S.save({ fields }).catch(fail);
      if (renamed) fieldsEditor.fields = fields;
    });
    statusEditor.addEventListener('t-change', event => {
      if (!event.detail.items.length) { tkit.toast(TEXT.keepOneStatus, { tone: 'error' }); statusEditor.items = statusesOf().slice(); return; }
      S.save({ statuses: event.detail.items }).catch(fail);
    });

    // ---- Start-up ----
    (async () => {
      S = await tkit.settings('settings', DEFAULTS);
      if (S.error) tkit.toast('Não deu para carregar os ajustes: ' + S.error.message, { tone: 'error', ms: 6000 });
      $('set-title').value = S.value.title; $('set-title').placeholder = appName;
      $('set-intro').value = S.value.intro; $('set-thanks').value = S.value.thanks;
      fieldsEditor.fields = S.value.fields;
      statusEditor.items = S.value.statuses;
      statusEditor.addLabel = 'Adicionar status';
      table.columns = tableColumns();
      Object.assign(tools, {   // Dados / Exemplos / Zona de perigo: all in the kit
        collection: submissions, noun: { one: 'envio', many: 'envios' }, filename: 'Envios', examples: sampleDocs,
        exportRows: () => records().map(r => Object.assign({ created_at: r.created_at }, r.data)),
        exportColumns: () => tkit.csv.columnsFor(detailFields()).concat([{ key: 'created_at', label: 'Recebido', format: localDate }]),
        beforeInsert: doc => Object.assign({ status: statusesOf()[0].id }, doc)   // imported rows start with the first status
      });
      renderFormView();
      S.on(() => { syncForm(); render(); });
      document.querySelector('t-app').addEventListener('t-view', () => { if (store) updateSummary(); });
      tkit.route.on(route => { wantedId = route.view === 'list' ? route.id : null; applyRoute(); });
      store = tkit.live(submissions, render, { order: '-created_at', onError: error => {
        tkit.clear($('list-state'));
        $('list-body').hidden = true;
        $('list-state').appendChild(tkit.h('t-state', { kind: 'error', title: 'Não deu para carregar os envios', text: error.message },
          tkit.h('button', { type: 'button', class: 't-button', text: 'Tentar de novo', onClick: () => store.reload().catch(() => {}) })));
      } });
    })();
  </script>
</body>
</html>
