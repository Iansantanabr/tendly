<!doctype html>
<html lang="pt-BR" data-app-color="{{COLOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="stylesheet" href="/api/hub/apps/kit.css">
  <script src="/api/hub/apps/sdk.js"></script>
  <script src="/api/hub/apps/kit.js"></script>
  <style>
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--t-space-3); }
    .stack { display: grid; gap: var(--t-space-4); min-width: 0; }
    .note { display: flex; align-items: center; flex-wrap: wrap; gap: var(--t-space-2); }
  </style>
</head>
<body>
  <t-app>
    <t-nav label="Seções">
      <span class="t-nav-title"><span class="t-tile" aria-hidden="true">{{LETTER}}</span><span>{{NAME}}</span></span>
      <button data-view="overview" data-icon="chart">Visão geral</button>
      <button data-view="entries" data-icon="table">Lançamentos</button>
      <button data-view="settings" data-icon="settings" class="t-nav-end">Ajustes</button>
    </t-nav>
    <main class="t-app-main">
      <t-view name="overview">
        <div class="t-page">
          <header class="t-page-head">
            <div><h1 class="t-title">{{NAME}}</h1><p class="t-muted">{{DESCRIPTION}}</p></div>
            <button type="button" class="t-button primary" id="new-entry">Novo lançamento</button>
          </header>
          <t-sample-banner></t-sample-banner>
          <t-empty-start id="empty" hidden title="Nenhum lançamento ainda" text="Adicione o primeiro lançamento para ver totais e gráficos, ou dê uma olhada com exemplos antes." action="Novo lançamento"></t-empty-start>
          <div id="overview-state"><t-state kind="loading"></t-state></div>
          <div class="stack" id="overview-content" hidden>
            <div class="t-toolbar"><div class="t-segment" id="period" role="group" aria-label="Período"></div></div>
            <div class="t-grid" id="stats"></div>
            <div class="charts">
              <section class="t-card"><h2 id="by-time-title">Por mês</h2><t-chart id="by-time" type="bar" label="Valor por mês"></t-chart></section>
              <section class="t-card"><h2>Por categoria</h2><t-chart id="by-category" type="bar" label="Valor por categoria"></t-chart></section>
            </div>
            <section class="t-card">
              <div class="t-card-head"><h2>Últimos lançamentos</h2><button type="button" class="t-button small ghost" id="see-all">Ver todos</button></div>
              <div class="t-list" id="latest"></div>
            </section>
          </div>
        </div>
      </t-view>
      <t-view name="entries">
        <div class="t-page wide">
          <header class="t-page-head"><h1 class="t-title">Lançamentos</h1><button type="button" class="t-button primary" id="new-entry-2">Novo lançamento</button></header>
          <t-sample-banner></t-sample-banner>
          <t-table id="table" searchable empty-text="Nenhum lançamento ainda. Adicione o primeiro."></t-table>
        </div>
      </t-view>
      <t-view name="settings">
        <div class="t-page">
          <header class="t-page-head"><div><h1 class="t-title">Ajustes</h1><p class="t-muted">As mudanças são salvas na hora.</p></div></header>
          <section class="t-card">
            <div class="t-card-head"><h2>Métrica</h2></div>
            <label class="t-field"><span>Nome do valor</span><input type="text" id="set-label" maxlength="40"></label>
            <div class="t-field"><span>Tipo de valor</span><div class="t-segment" id="set-unit" role="group" aria-label="Tipo de valor"></div></div>
            <label class="t-field" id="set-currency-field"><span>Moeda</span><select id="set-currency"></select></label>
          </section>
          <section class="t-card">
            <div class="t-card-head"><h2>Meta</h2></div>
            <label class="t-field"><span>Meta por mês (opcional)</span><input type="number" id="set-goal" min="0" step="any" inputmode="decimal"></label>
            <p class="t-muted">A visão geral compara o período com ela: um trimestre conta 3 meses, um ano 12. Deixe vazio para não ter meta.</p>
          </section>
          <section class="t-card">
            <div class="t-card-head"><h2>Categorias</h2></div>
            <t-list-editor id="categories" tones></t-list-editor>
            <div id="category-notes"></div>
          </section>
          <t-data-tools id="tools"></t-data-tools>
        </div>
      </t-view>
    </main>
  </t-app>

  <t-modal id="editor" title="Lançamento">
    <t-record-form id="entry-form"></t-record-form>
    <div class="t-actions">
      <button type="button" class="t-button danger" id="delete" hidden>Apagar</button>
      <span class="t-spacer"></span>
      <button type="button" class="t-button" id="cancel">Cancelar</button>
      <button type="button" class="t-button primary" id="save">Salvar</button>
    </div>
  </t-modal>
  <t-detail id="detail" title-field="category">
    <button type="button" slot="actions" class="t-button" id="detail-edit">Editar</button>
    <button type="button" slot="actions" class="t-button danger" id="detail-delete">Apagar</button>
  </t-detail>

  <script>
    // ---- Constants and default settings ---------------------------------------------------------------
    // Records live in the collection `entries`: { date, amount, category (the LABEL text), notes }.
    // Settings live in tendly.data under `settings`. Categories are stored by label, so a category that is
    // not in the list (old data, typed by hand) still shows; Settings offers to add it.
    const DEFAULTS = { v: 1, metricLabel: 'Valor', unit: 'money', currency: 'BRL', categories: [], goal: null, period: 'quarter' };
    const PERIODS = [['month', 'Mês'], ['quarter', 'Trimestre'], ['year', 'Ano'], ['all', 'Tudo']];
    const PERIOD_NAMES = { month: 'mês', quarter: 'trimestre', year: 'ano', all: 'tudo' };
    const CURRENCIES = ['BRL', 'USD', 'EUR', 'GBP', 'MXN', 'ARS', 'CLP', 'COP'];
    const NO_CATEGORY = 'Sem categoria';
    const SAMPLE_CATEGORIES = [{ label: 'Vendas online', tone: 'accent' }, { label: 'Loja', tone: 'ok' }, { label: 'Serviços', tone: 'info' }, { label: 'Assinaturas', tone: 'violet' }];
    const SAMPLE_NOTES = ['', 'Cliente recorrente', 'Promoção de temporada', '', 'Primeiro pedido', 'Pago adiantado'];

    const entries = tendly.db.collection('entries');
    const $ = id => document.getElementById(id);
    const app = document.querySelector('t-app'), tools = $('tools');
    const fail = error => tkit.toast(error && error.message ? error.message : String(error), { tone: 'error' });
    const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
    const pad = n => String(n).padStart(2, '0');
    const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    let settings, store, editing = null, detailId = null;
    const renames = {};                  // category id -> { from, to }: renamed in Settings, records not updated yet
    const cfg = () => settings.value;
    const fmt = value => cfg().unit === 'money' ? tkit.money(value, cfg().currency) : tkit.number(value);

    // ---- Data helpers ----------------------------------------------------------------------------------
    const rowsOf = records => records.map(r => Object.assign({ id: r.id }, r.data));
    const catOf = row => String(row.category || '').trim();
    const amountOf = row => Number(row.amount) || 0;
    const newestFirst = (a, b) => String(b.date || '').localeCompare(String(a.date || ''));
    const sum = rows => rows.reduce((s, r) => s + amountOf(r), 0);

    function range(period) {             // first and last day of the period, as YYYY-MM-DD
      const now = new Date(), y = now.getFullYear(), m = now.getMonth(), q = m - m % 3;
      if (period === 'month') return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))];
      if (period === 'quarter') return [iso(new Date(y, q, 1)), iso(new Date(y, q + 3, 0))];
      if (period === 'year') return [y + '-01-01', y + '-12-31'];
      return ['0000-01-01', '9999-12-31'];
    }
    function monthKeys(from, to) {       // ['2026-09', '2026-10', ...] from the month of `from` to the month of `to`
      const keys = [], end = to.slice(0, 7);
      for (let d = new Date(+from.slice(0, 4), +from.slice(5, 7) - 1, 1); iso(d).slice(0, 7) <= end && keys.length < 120; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) keys.push(iso(d).slice(0, 7));
      return keys;
    }
    const monthLabel = (key, withYear) => new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1).toLocaleDateString(document.documentElement.lang, withYear ? { month: 'short', year: '2-digit' } : { month: 'short' });
    function goalFor(period, rows) {     // the goal is per month; other periods count their months
      const goal = Number(cfg().goal) || 0;
      if (!goal) return 0;
      if (period !== 'all') return goal * { month: 1, quarter: 3, year: 12 }[period];
      const dates = rows.map(r => String(r.date || '')).filter(Boolean).sort();
      return dates.length ? goal * monthKeys(dates[0], iso(new Date())).length : goal;
    }
    function categoryOptions() {         // the listed categories, then any other label the records use. id = label (that is what is stored)
      const listed = cfg().categories.map(c => ({ id: c.label, label: c.label, tone: c.tone || '' }));
      const extra = [...new Set(rowsOf(store ? store.records : []).map(catOf).filter(Boolean))].filter(l => !listed.some(o => o.id === l)).sort();
      return listed.concat(extra.map(l => ({ id: l, label: l, tone: '' })));
    }
    function fieldsFor() {               // the schema shared by the form, the detail and the CSV import
      const options = categoryOptions(), help = 'Gerencie as categorias em Ajustes.';
      return [
        { id: 'date', label: 'Data', type: 'date', required: true },
        { id: 'amount', label: cfg().metricLabel, type: cfg().unit === 'money' ? 'money' : 'number', currency: cfg().currency, required: true },
        options.length ? { id: 'category', label: 'Categoria', type: 'choice', options, required: true, help, creatable: true } : { id: 'category', label: 'Categoria', type: 'text', required: true, help },
        { id: 'notes', label: 'Notas', type: 'text' }
      ];
    }

    // ---- Overview ----------------------------------------------------------------------------------------
    function segment(el, options, value, onPick) {
      tkit.clear(el);
      options.forEach(([id, label]) => el.appendChild(tkit.h('button', { type: 'button', 'aria-pressed': String(id === value), text: label, onClick: () => onPick(id) })));
    }
    function statCard(label, value, extra) {
      return tkit.h('div', { class: 't-card t-stat' }, tkit.h('strong', { text: value }), tkit.h('span', { text: label }), extra || null);
    }
    function renderOverview(records) {
      const all = rowsOf(records), state = $('overview-state'), content = $('overview-content');
      tkit.clear(state);
      content.hidden = true;
      $('empty').hidden = all.length > 0;
      if (!all.length) { tkit.context({ summary: 'Painel: nenhum lançamento ainda' }); return; }
      const period = cfg().period, [from, to] = range(period);
      segment($('period'), PERIODS, period, id => settings.save({ period: id }).catch(fail));
      const rows = all.filter(r => r.date >= from && r.date <= to);
      if (!rows.length) {
        state.appendChild(tkit.h('t-state', { kind: 'empty', title: 'Nada encontrado', text: 'Nenhum lançamento neste período.' },
          tkit.h('button', { type: 'button', class: 't-button', onClick: () => settings.save({ period: 'all' }).catch(fail), text: 'Limpar filtro' })));
        content.hidden = false;
        $('stats').hidden = $('latest').parentNode.hidden = true;
        document.querySelector('.charts').hidden = true;
        tkit.context({ summary: 'Painel (' + PERIOD_NAMES[period] + '): nenhum lançamento no período' });
        return;
      }
      content.hidden = false;
      $('stats').hidden = $('latest').parentNode.hidden = document.querySelector('.charts').hidden = false;
      const total = sum(rows), byCat = tkit.groupBy(rows, r => catOf(r) || NO_CATEGORY);
      const cats = Object.keys(byCat).map(c => ({ label: c, value: sum(byCat[c]) })).sort((a, b) => b.value - a.value);
      const goal = goalFor(period, all), percent = goal ? Math.round(total / goal * 100) : 0;

      const stats = $('stats');
      tkit.clear(stats);
      stats.appendChild(statCard('Total no período', fmt(total)));
      stats.appendChild(statCard('Média por lançamento', fmt(total / rows.length)));
      stats.appendChild(statCard('Maior categoria: ' + fmt(cats[0].value), cats[0].label));
      if (goal) stats.appendChild(statCard('Meta atingida', percent + '%', tkit.h('t-progress', { value: String(Math.round(total)), max: String(Math.round(goal)), label: 'Meta' })));

      const byTime = $('by-time'), daily = period === 'month';
      $('by-time-title').textContent = daily ? 'Por dia' : 'Por mês';
      byTime.setAttribute('label', cfg().metricLabel + (daily ? ' por dia' : ' por mês'));
      if (daily) {
        byTime.data = Array.from({ length: +to.slice(8) }, (_, i) => ({ label: String(i + 1), value: sum(rows.filter(r => +r.date.slice(8) === i + 1)) }));
      } else {
        const dates = all.map(r => r.date).filter(Boolean).sort();
        const keys = monthKeys(period === 'all' ? dates[0] : from, period === 'all' ? iso(new Date()) : to).slice(-36);
        const months = tkit.groupBy(rows, r => String(r.date).slice(0, 7));
        byTime.data = keys.map(k => ({ label: monthLabel(k, period === 'all'), value: sum(months[k] || []) }));
      }
      $('by-category').setAttribute('label', cfg().metricLabel + ' por categoria');
      $('by-category').data = cats.slice(0, 8);

      const latest = $('latest');
      tkit.clear(latest);
      rows.slice().sort(newestFirst).slice(0, 5).forEach(r => latest.appendChild(tkit.h('button', { type: 'button', class: 't-row', onClick: () => showDetail(r.id) },
        tkit.h('span', { class: 't-row-text' }, tkit.h('span', { text: catOf(r) || NO_CATEGORY }), tkit.h('small', { text: tkit.date(r.date) + (r.notes ? ' · ' + r.notes : '') })),
        tkit.h('strong', { text: fmt(amountOf(r)) }))));
      tkit.context({ summary: 'Painel (' + PERIOD_NAMES[period] + '): total ' + fmt(total) + ' em ' + plural(rows.length, 'lançamento', 'lançamentos') + (goal ? '; meta ' + percent + '%' : '') });
    }

    // ---- Entries table -----------------------------------------------------------------------------------
    function renderTable(records) {
      const table = $('table'), tones = {};
      categoryOptions().forEach(o => { tones[o.label] = o.tone; });
      table.columns = [
        { key: 'date', label: 'Data', type: 'date' },
        { key: 'category', label: 'Categoria', type: 'badge', tones },
        { key: 'amount', label: cfg().metricLabel, type: cfg().unit === 'money' ? 'money' : 'number', currency: cfg().currency },
        { key: 'notes', label: 'Notas' }
      ];
      table.rows = rowsOf(records).sort(newestFirst);
    }

    // ---- Detail and editor ---------------------------------------------------------------------------------
    function showDetail(id) {
      const record = store.records.find(r => r.id === id);
      if (!record) return;
      detailId = id;
      const detail = $('detail');
      detail.fields = fieldsFor();
      detail.settings = { currency: cfg().currency };
      detail.siblings = store.records.slice().sort((a, b) => newestFirst(a.data, b.data)).map(r => r.id);
      detail.record = record;
      detail.open();
      tkit.context({ selection: 'Lançamento: ' + (record.data.category || NO_CATEGORY) + ', ' + fmt(record.data.amount) + ', ' + tkit.date(record.data.date) });
    }
    function applyRoute(route) {         // a link like #entries/<id> opens that entry
      const detail = $('detail');
      if (!route.id) { if (detail.opened) detail.close(); return; }
      if (!detail.opened || detailId !== route.id) showDetail(route.id);
    }
    function openEditor(record) {
      editing = record || null;
      const form = $('entry-form');
      form.fields = fieldsFor();
      form.settings = { currency: cfg().currency };
      form.value = record ? record.data : { date: tkit.today() };
      $('delete').hidden = !record;
      $('editor').title = record ? 'Editar lançamento' : 'Novo lançamento';
      $('editor').open();
    }
    async function saveEntry() {
      let data;
      try { data = await $('entry-form').submit(); } catch (error) { if (error.code !== 'invalid') fail(error); return; }
      const made = cfg().categories.find(c => c.id === data.category);   // a category made in the form has a slug id; records store the label
      if (made && !cfg().categories.some(c => c.label === data.category)) data.category = made.label;
      try {
        if (editing) await entries.update(editing.id, data, { rev: editing.rev });
        else await entries.insert(data);
        $('editor').close();
      } catch (error) {
        if (error.code === 'conflict') { tkit.toast('Alguém mudou este lançamento enquanto isso; recarreguei.', { tone: 'error' }); editing = error.current; $('entry-form').value = editing.data; }
        else fail(error);
      }
    }
    async function deleteEntry(record) {
      if (!record || !await tkit.confirm('Apagar este lançamento?', { confirm: 'Apagar', tone: 'danger' })) return;
      try { $('detail').close(); $('editor').close(); await entries.remove(record.id); } catch (error) { fail(error); }
    }

    // ---- Settings screen -------------------------------------------------------------------------------------
    function renderSettings(records) {
      const rows = rowsOf(records), c = cfg();
      const set = (el, value) => { if (document.activeElement !== el) el.value = value; };
      set($('set-label'), c.metricLabel);
      set($('set-goal'), c.goal === null ? '' : c.goal);
      segment($('set-unit'), [['money', 'Dinheiro'], ['number', 'Número']], c.unit, id => settings.save({ unit: id }).catch(fail));
      $('set-currency-field').hidden = c.unit !== 'money';
      const currency = $('set-currency');
      tkit.clear(currency);
      (CURRENCIES.includes(c.currency) ? CURRENCIES : CURRENCIES.concat(c.currency)).forEach(code => currency.appendChild(tkit.h('option', { value: code, text: code })));
      currency.value = c.currency;

      const list = $('categories'), used = {};
      rows.forEach(r => { used[catOf(r)] = (used[catOf(r)] || 0) + 1; });
      list.addLabel = 'Adicionar categoria';
      list.inUse = Object.fromEntries(c.categories.map(cat => [cat.id, used[cat.label] || 0]));
      list.items = c.categories;

      const notes = $('category-notes');
      tkit.clear(notes);
      const note = (text, label, onClick) => notes.appendChild(tkit.h('div', { class: 'note' }, tkit.h('span', { class: 't-muted', text }), tkit.h('button', { type: 'button', class: 't-button small', text: label, onClick })));
      Object.keys(renames).forEach(id => {
        const { from, to } = renames[id], n = used[from] || 0;
        if (n) note('"' + from + '" agora é "' + to + '", mas ' + plural(n, 'lançamento ainda usa', 'lançamentos ainda usam') + ' o nome antigo.', 'Atualizar ' + plural(n, 'lançamento', 'lançamentos'), () => renameRecords(id, from, to));
      });
      const renamedFrom = Object.keys(renames).map(id => renames[id].from);
      const unlisted = Object.keys(used).filter(l => l && !c.categories.some(cat => cat.label === l) && !renamedFrom.includes(l));
      if (unlisted.length) note('Usadas em lançamentos, mas fora da lista: ' + unlisted.join(', ') + '.', 'Adicionar à lista', () => addToList(unlisted));

      tools.fields = fieldsFor();
      tools.records = records;
    }
    function saveCategories(items) {
      const before = cfg().categories;
      items.forEach(item => {
        const old = before.find(b => b.id === item.id);
        if (!old || old.label === item.label) return;
        const pending = renames[item.id] || (renames[item.id] = { from: old.label });
        pending.to = item.label;
        if (pending.to === pending.from) delete renames[item.id];
      });
      Object.keys(renames).forEach(id => { if (!items.some(i => i.id === id)) delete renames[id]; });
      settings.save({ categories: items }).catch(fail);
    }
    function addToList(labels) {
      const items = cfg().categories.slice();
      labels.forEach(label => items.push({ id: tkit.slug(label, items.map(i => i.id)), label, tone: '' }));
      settings.save({ categories: items }).catch(fail);
    }
    async function renameRecords(id, from, to) {
      const targets = store.records.filter(r => r.data.category === from);
      try { for (const r of targets) await entries.update(r.id, { category: to }); delete renames[id]; tkit.toast('Atualizados: ' + plural(targets.length, 'lançamento', 'lançamentos')); } catch (error) { fail(error); }
      renderSettings(store.records);
    }

    // ---- Examples (CSV and the danger zone are <t-data-tools>) -----------------------------------------
    function sampleDocs() {              // 30 entries over ~6 months, 4 categories, amounts trending up
      return Array.from({ length: 30 }, (_, i) => ({
        date: tkit.daysFromToday(-(179 - i * 6)),
        amount: 600 + i * 45 + ((i * 7) % 5) * 60,
        category: SAMPLE_CATEGORIES[i % 4].label,
        notes: SAMPLE_NOTES[i % 6]
      }));
    }
    async function seedCategories() {    // examples come with their categories, unless the person already has some
      if (!cfg().categories.length) await settings.save({ categories: SAMPLE_CATEGORIES.map(c => ({ id: tkit.slug(c.label), label: c.label, tone: c.tone })) });
    }
    const loadSamples = () => seedCategories().then(() => tkit.samples.load(entries, sampleDocs())).catch(fail);

    // ---- Render and events ---------------------------------------------------------------------------------
    function render() {
      const records = store ? store.records : [];
      const examples = tkit.samples.count(records);
      document.querySelectorAll('t-sample-banner').forEach(b => { b.count = examples; });
      renderOverview(records);
      renderTable(records);
      renderSettings(records);
      if (store) applyRoute(tkit.route.get());   // a link may have been waiting for the records
    }
    ['new-entry', 'new-entry-2'].forEach(id => $(id).addEventListener('click', () => openEditor(null)));
    $('see-all').addEventListener('click', () => { app.view = 'entries'; });
    $('save').addEventListener('click', saveEntry);
    $('cancel').addEventListener('click', () => $('editor').close());
    $('delete').addEventListener('click', () => deleteEntry(editing));
    $('editor').addEventListener('t-close', () => tendly.host.holdReload(false));
    $('entry-form').addEventListener('t-input', () => tendly.host.holdReload(true));
    $('table').addEventListener('t-open', event => showDetail(event.detail.id));
    $('detail').addEventListener('t-nav', event => showDetail(event.detail.id));
    $('detail').addEventListener('t-close', () => { detailId = null; });
    $('detail-edit').addEventListener('click', () => { const record = store.records.find(r => r.id === detailId); $('detail').close(); if (record) openEditor(record); });
    $('detail-delete').addEventListener('click', () => deleteEntry(store.records.find(r => r.id === detailId)));
    $('set-label').addEventListener('change', event => settings.save({ metricLabel: event.target.value.trim() || DEFAULTS.metricLabel }).catch(fail));
    $('set-goal').addEventListener('change', event => { const goal = Number(event.target.value); settings.save({ goal: goal > 0 ? goal : null }).catch(fail); });
    $('set-currency').addEventListener('change', event => settings.save({ currency: event.target.value }).catch(fail));
    $('categories').addEventListener('t-change', event => saveCategories(event.detail.items));
    $('empty').addEventListener('t-action', () => openEditor(null));
    $('empty').addEventListener('t-examples', loadSamples);
    document.addEventListener('t-clear', () => tkit.samples.clear(entries).catch(fail));   // <t-sample-banner>
    $('entry-form').addEventListener('t-option-added', event => {   // a category typed in the form joins the list
      const { option } = event.detail;
      settings.save({ categories: cfg().categories.concat({ id: option.id, label: option.label, tone: option.tone || '' }) }).catch(fail);
    });
    Object.assign(tools, {
      collection: entries, examples: sampleDocs, beforeExamples: seedCategories, filename: 'Lançamentos', noun: { one: 'lançamento', many: 'lançamentos' },
      exportRows: list => list.slice().sort((a, b) => newestFirst(a.data, b.data)).map(r => r.data),
    });
    app.addEventListener('t-view', () => { if (store) render(); });   // the kit clears the summary on a view switch

    // ---- Start-up ----------------------------------------------------------------------------------------------
    (async () => {
      settings = await tkit.settings('settings', DEFAULTS);
      if (settings.error) tkit.toast('Não consegui ler os ajustes; usando os padrões.', { tone: 'error' });
      settings.on(() => render());
      store = tkit.live(entries, render, { onError: error => {
        const state = $('overview-state');
        tkit.clear(state);
        $('overview-content').hidden = true;
        $('empty').hidden = true;
        state.appendChild(tkit.h('t-state', { kind: 'error', title: 'Não deu para carregar os lançamentos', text: error.message },
          tkit.h('button', { type: 'button', class: 't-button', text: 'Tentar de novo', onClick: () => store.reload().catch(() => {}) })));
      } });
      tkit.route.on(applyRoute);
    })();
  </script>
</body>
</html>
