<!doctype html>
<html lang="pt-BR" data-app-color="{{COLOR}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <link rel="stylesheet" href="/api/hub/apps/kit.css">
  <script src="/api/hub/apps/sdk.js"></script>
  <script src="/api/hub/apps/kit.js"></script>
  <style>
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--t-space-3); }
  </style>
</head>
<body>
  <t-app>
    <t-nav label="Seções">
      <span class="t-nav-title"><span class="t-tile" aria-hidden="true">{{LETTER}}</span><span>{{NAME}}</span></span>
      <button data-view="overview" data-icon="chart">Visão geral</button>
      <button data-view="entries" data-icon="table">Lançamentos</button>
    </t-nav>
    <main class="t-app-main">
      <t-view name="overview">
        <div class="t-page">
          <header class="t-page-head">
            <div><h1 class="t-title">{{NAME}}</h1><p class="t-muted">{{DESCRIPTION}}</p></div>
            <button type="button" class="t-button primary" id="new-entry">Novo lançamento</button>
          </header>
          <div class="t-grid" id="stats"></div>
          <div class="charts">
            <section class="t-card"><h2>Por mês</h2><t-chart id="by-month" type="line" label="Valor por mês"></t-chart></section>
            <section class="t-card"><h2>Por categoria</h2><t-chart id="by-category" type="bar" label="Valor por categoria"></t-chart></section>
          </div>
          <div id="overview-state"></div>
        </div>
      </t-view>
      <t-view name="entries">
        <div class="t-page wide">
          <header class="t-page-head"><h1 class="t-title">Lançamentos</h1><button type="button" class="t-button primary" id="new-entry-2">Novo lançamento</button></header>
          <t-table id="table" searchable empty-text="Nenhum lançamento ainda. Adicione o primeiro."></t-table>
        </div>
      </t-view>
    </main>
  </t-app>

  <t-modal id="editor" title="Lançamento">
    <form id="entry-form" class="t-form">
      <div class="t-form-row">
        <label class="t-field"><span>Data</span><input name="date" type="date" required></label>
        <label class="t-field"><span>Valor</span><input name="amount" type="number" step="0.01" required></label>
      </div>
      <label class="t-field"><span>Categoria</span><input name="category" type="text" list="categories" required maxlength="60"></label>
      <datalist id="categories"></datalist>
      <label class="t-field"><span>Notas</span><input name="notes" type="text" maxlength="300"></label>
      <div class="t-actions">
        <button type="button" class="t-button danger" id="delete" hidden>Apagar</button>
        <span class="t-spacer"></span>
        <button type="button" class="t-button" id="cancel">Cancelar</button>
        <button type="submit" class="t-button primary">Salvar</button>
      </div>
    </form>
  </t-modal>

  <script>
    const entries = tendly.db.collection('entries');
    const table = document.getElementById('table');
    const stats = document.getElementById('stats');
    const editor = document.getElementById('editor');
    const form = document.getElementById('entry-form');
    const fail = error => tkit.toast(error && error.message ? error.message : String(error), { tone: 'error' });
    let editing = null, store;

    table.columns = [
      { key: 'date', label: 'Data', type: 'date' },
      { key: 'category', label: 'Categoria', type: 'badge' },
      { key: 'amount', label: 'Valor', type: 'number' },
      { key: 'notes', label: 'Notas' }
    ];

    function render(records) {
      const rows = records.map(r => Object.assign({ id: r.id }, r.data));
      table.rows = rows;
      const thisMonth = tkit.today().slice(0, 7);
      const total = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const month = rows.filter(r => String(r.date || '').slice(0, 7) === thisMonth).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      tkit.clear(stats);
      [['Total', tkit.number(total)], ['Este mês', tkit.number(month)], ['Lançamentos', tkit.number(rows.length, 0)]].forEach(([label, value]) => {
        stats.appendChild(tkit.h('div', { class: 't-card t-stat' }, tkit.h('strong', { text: value }), tkit.h('span', { text: label })));
      });
      const months = tkit.groupBy(rows, r => String(r.date || '').slice(0, 7));
      document.getElementById('by-month').data = Object.keys(months).filter(Boolean).sort().slice(-12).map(m => ({ label: m.slice(5) + '/' + m.slice(2, 4), value: months[m].reduce((s, r) => s + (Number(r.amount) || 0), 0) }));
      const categories = tkit.groupBy(rows, 'category');
      document.getElementById('by-category').data = Object.keys(categories).filter(Boolean).map(c => ({ label: c, value: categories[c].reduce((s, r) => s + (Number(r.amount) || 0), 0) })).sort((a, b) => b.value - a.value).slice(0, 8);
      const list = document.getElementById('categories');
      tkit.clear(list);
      Object.keys(categories).filter(Boolean).sort().forEach(c => list.appendChild(tkit.h('option', { value: c })));
      const state = document.getElementById('overview-state');
      tkit.clear(state);
      if (!rows.length) state.appendChild(tkit.h('t-state', { kind: 'empty', title: 'Nenhum lançamento ainda', text: 'Os gráficos se preenchem conforme você adiciona lançamentos.' }));
    }

    function openEditor(record) {
      editing = record || null;
      tkit.fill(form, record ? record.data : { date: tkit.today() });
      document.getElementById('delete').hidden = !record;
      editor.title = record ? 'Editar lançamento' : 'Novo lançamento';
      editor.open();
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const values = tkit.form(form);
      try {
        if (editing) await entries.update(editing.id, values, { rev: editing.rev });
        else await entries.insert(values);
        editor.close();
      } catch (error) {
        if (error.code === 'conflict') { tkit.toast('Alguém mudou este lançamento enquanto isso; ele foi recarregado.', { tone: 'error' }); editing = error.current; tkit.fill(form, editing.data); }
        else fail(error);
      }
    });
    document.getElementById('cancel').addEventListener('click', () => editor.close());
    document.getElementById('delete').addEventListener('click', async () => {
      if (!editing || !await tkit.confirm('Apagar este lançamento?', { confirm: 'Apagar', tone: 'danger' })) return;
      try { await entries.remove(editing.id); editor.close(); } catch (error) { fail(error); }
    });
    document.getElementById('new-entry').addEventListener('click', () => openEditor(null));
    document.getElementById('new-entry-2').addEventListener('click', () => openEditor(null));
    editor.addEventListener('t-close', () => { tendly.host.holdReload(false); });
    form.addEventListener('input', () => { tendly.host.holdReload(true); });
    table.addEventListener('t-open', event => openEditor(store.records.find(r => r.id === event.detail.id)));

    store = tkit.live(entries, render, { order: '-created_at', onError: error => {
      const state = document.getElementById('overview-state');
      tkit.clear(state);
      state.appendChild(tkit.h('t-state', { kind: 'error', title: 'Não deu para carregar os lançamentos', text: error.message }));
    } });
  </script>
</body>
</html>
