<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}}</title>
  <script src="/api/hub/apps/sdk.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #5f6672;
      --line: #e5e7eb; --field: #8b929e; --accent: {{ACCENT}}; --danger: #b42318; --ok: #1a7f4b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181c; --card: #1f2227; --text: #e6e6e6; --muted: #a3aab5; --line: #2d3139; --field: #7b8290; --danger: #f97066; --ok: #4ade80; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
    header { display: flex; align-items: center; gap: 12px; }
    .badge {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none;
      background: var(--accent); color: #fff; font-weight: 700;
    }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 15px; margin: 0; }
    p { margin: 0; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    label small { font-weight: 400; color: var(--muted); }
    input[type="text"], textarea {
      font: inherit; font-size: 16px; width: 100%; padding: 8px 10px; border: 1px solid var(--field);
      border-radius: 8px; background: var(--bg); color: var(--text);
    }
    textarea { min-height: 84px; resize: vertical; }
    button {
      font: inherit; border: 1px solid var(--field); background: var(--card); color: var(--text);
      border-radius: 8px; padding: 6px 14px; min-height: 34px; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
    .status.error { color: var(--danger); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    li.issue { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--bg); }
    li.issue.done .title { text-decoration: line-through; color: var(--muted); }
    .title { font-weight: 600; overflow-wrap: anywhere; }
    .details { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta { font-size: 13px; color: var(--muted); }
    .state { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .state.done { color: var(--ok); border-color: var(--ok); }
    .empty { color: var(--muted); }
    .hint { font-size: 13px; }
    code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    @media (pointer: coarse) { button { min-height: 44px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="badge" aria-hidden="true">{{LETTER}}</div>
      <div>
        <h1>{{NAME}}</h1>
        <p>{{DESCRIPTION}}</p>
      </div>
    </header>

    <form class="card" id="form">
      <h2 data-t="new">Report a problem</h2>
      <label><span data-t="title">What happened?</span>
        <input type="text" id="title" maxlength="200" required autocomplete="off">
      </label>
      <label><span><span data-t="details">Details</span> <small data-t="optional">(optional: where, what you expected, how to see it again)</small></span>
        <textarea id="details" maxlength="4000"></textarea>
      </label>
      <div class="row">
        <button class="primary" type="submit" id="add" data-t="add">Add to the list</button>
        <span class="status grow" id="status" role="status"></span>
      </div>
    </form>

    <section class="card" aria-labelledby="list-title">
      <div class="row">
        <h2 class="grow" id="list-title"><span data-t="list">Reported</span> <span class="meta" id="counts"></span></h2>
        <label class="row" style="font-weight:400"><input type="checkbox" id="show-done"> <span data-t="showDone">Show resolved</span></label>
        <button type="button" id="copy" data-t="copy">Copy open ones</button>
      </div>
      <p class="empty" id="empty" hidden></p>
      <ul id="issues"></ul>
      <p class="hint"><span data-t="hint">Your agent can read this list in</span> <code id="where"></code></p>
    </section>
  </main>
  <script>
    'use strict';
    // The list is one JSON value kept with tendly.data under the key "issues":
    //   [{ id, title, details, created_at, done_at }]   (done_at is null while open)
    const KEY = 'issues';
    const TEXT = {
      en: {
        new: 'Report a problem', title: 'What happened?', details: 'Details',
        optional: '(optional: where, what you expected, how to see it again)', add: 'Add to the list',
        list: 'Reported', showDone: 'Show resolved', copy: 'Copy open ones',
        hint: 'Your agent can read this list in', open: 'Open', done: 'Resolved',
        resolve: 'Mark resolved', reopen: 'Reopen', remove: 'Remove', confirm: 'Remove for good', cancel: 'Cancel',
        saved: 'Saved.', copied: 'Copied.', nothingOpen: 'Nothing open: no problem waiting.',
        nothing: 'Nothing reported yet. Use the form above when something goes wrong.',
        counts: (open, done) => `${open} open · ${done} resolved`,
        loadError: 'Could not load the list: ', saveError: 'Could not save: ', copyError: 'Could not copy. Select the text instead.',
      },
      pt: {
        new: 'Reportar um problema', title: 'O que aconteceu?', details: 'Detalhes',
        optional: '(opcional: onde, o que você esperava, como ver de novo)', add: 'Adicionar à lista',
        list: 'Reportados', showDone: 'Mostrar resolvidos', copy: 'Copiar os abertos',
        hint: 'Seu agente pode ler esta lista em', open: 'Aberto', done: 'Resolvido',
        resolve: 'Marcar resolvido', reopen: 'Reabrir', remove: 'Remover', confirm: 'Remover de vez', cancel: 'Cancelar',
        saved: 'Salvo.', copied: 'Copiado.', nothingOpen: 'Nada aberto: nenhum problema esperando.',
        nothing: 'Nada reportado ainda. Use o formulário acima quando algo der errado.',
        counts: (open, done) => `${open} abertos · ${done} resolvidos`,
        loadError: 'Não foi possível carregar a lista: ', saveError: 'Não foi possível salvar: ', copyError: 'Não foi possível copiar. Selecione o texto.',
      },
    };
    const lang = (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt' : 'en';
    const T = TEXT[lang];
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    for (const node of document.querySelectorAll('[data-t]')) node.textContent = T[node.dataset.t];

    const $ = (id) => document.getElementById(id);
    let issues = [];
    let confirming = null;

    function say(text, error) {
      $('status').textContent = text;
      $('status').className = 'status grow' + (error ? ' error' : '');
    }
    const when = (iso) => new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const sane = (list) => Array.isArray(list) ? list.filter((item) => item && typeof item.id === 'string' && typeof item.title === 'string') : [];

    function button(label, onClick, className) {
      const node = document.createElement('button');
      node.type = 'button';
      node.textContent = label;
      if (className) node.className = className;
      node.addEventListener('click', onClick);
      return node;
    }

    function render() {
      const open = issues.filter((item) => !item.done_at);
      const done = issues.filter((item) => item.done_at);
      $('counts').textContent = issues.length ? T.counts(open.length, done.length) : '';
      const shown = $('show-done').checked ? [...open, ...done] : open;
      const list = $('issues');
      list.textContent = '';
      $('empty').hidden = shown.length > 0;
      $('empty').textContent = issues.length ? T.nothingOpen : T.nothing;
      $('copy').disabled = open.length === 0;
      for (const item of shown) {
        const row = document.createElement('li');
        row.className = 'issue' + (item.done_at ? ' done' : '');
        const head = document.createElement('div');
        head.className = 'row';
        const title = document.createElement('span');
        title.className = 'title grow';
        title.textContent = item.title;
        const state = document.createElement('span');
        state.className = 'state' + (item.done_at ? ' done' : '');
        state.textContent = item.done_at ? T.done : T.open;
        head.append(title, state);
        row.append(head);
        if (item.details) {
          const details = document.createElement('div');
          details.className = 'details';
          details.textContent = item.details;
          row.append(details);
        }
        const foot = document.createElement('div');
        foot.className = 'row';
        const meta = document.createElement('span');
        meta.className = 'meta grow';
        meta.textContent = when(item.created_at);
        foot.append(meta);
        if (confirming === item.id) {
          // The first click arms, the second confirms: no native dialog.
          foot.append(
            button(T.confirm, () => change((list) => list.filter((other) => other.id !== item.id)), 'danger'),
            button(T.cancel, () => { confirming = null; render(); }),
          );
        } else {
          foot.append(
            button(item.done_at ? T.reopen : T.resolve, () => change((list) => list.map((other) =>
              other.id === item.id ? { ...other, done_at: other.done_at ? null : new Date().toISOString() } : other))),
            button(T.remove, () => { confirming = item.id; render(); }),
          );
        }
        row.append(foot);
        list.append(row);
      }
    }

    // Read the stored list again before every change, so a change made in
    // another window is not written over by an old copy.
    async function change(edit) {
      confirming = null;
      try {
        issues = edit(sane(await tendly.data.get(KEY, [])));
        await tendly.data.set(KEY, issues);
        say(T.saved);
      } catch (error) {
        say(T.saveError + error.message, true);
      }
      render();
    }

    async function load() {
      try {
        issues = sane(await tendly.data.get(KEY, []));
        say('');
      } catch (error) {
        say(T.loadError + error.message, true);
      }
      render();
    }

    $('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = $('title').value.trim();
      if (!title) return;
      const item = {
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
        title, details: $('details').value.trim(), created_at: new Date().toISOString(), done_at: null,
      };
      $('add').disabled = true;
      await change((list) => [item, ...list]);
      $('add').disabled = false;
      if (issues.some((other) => other.id === item.id)) { $('title').value = ''; $('details').value = ''; $('title').focus(); }
    });
    $('show-done').addEventListener('change', render);
    $('copy').addEventListener('click', async () => {
      const text = issues.filter((item) => !item.done_at)
        .map((item) => '- ' + item.title + (item.details ? '\n  ' + item.details.replace(/\n/g, '\n  ') : '')).join('\n');
      try { await navigator.clipboard.writeText(text); say(T.copied); }
      catch (_) { say(T.copyError, true); }
    });
    window.addEventListener('focus', load);
    $('where').textContent = 'apps/' + ((window.tendly && tendly.app && tendly.app.slug) || 'reportes') + '/data/' + KEY + '.json';
    load();
  </script>
</body>
</html>
